    label: "Footer Storage PID"
    description: "Die UID des Sysfolder-Ordners, in dem das Footer-Element liegt."
    type: int
    default: 0
    category: footer

  form.contact.recipientEmail:
    label: "Empfänger E-Mail"
    default: "your.email@example.com"
    type: string
    category: form.contact

  form.contact.recipientName:
    label: "Empfänger Name"
    default: "Portfolio"
