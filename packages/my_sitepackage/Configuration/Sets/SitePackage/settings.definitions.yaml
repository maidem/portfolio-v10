categories:
  form.contact:
    label: "Kontaktformular"
  nav:
    label: "Navigation"
  news:
    label: "News / Notes"

settings:
  nav.homeTitle:
    label: "Home-Link Bezeichnung"
    description: "Der angezeigte Name des Home-Links in der Navigation (z.B. 'About me')."
    type: string
    default: "About me"
    category: nav

  nav.techTitle:
    label: "Skills-Abschnitt Bezeichnung"
    description: "Titel des Skills/Technologien-Abschnitts im PDF-Export (z.B. 'Skills' oder 'Fokus')."
    type: string
    default: "Skills"
    category: nav

  news.notesDetailPid:
    label: "Notes-Detailseite PID"
    description: "UID der Seite 'Detail-Notes'. Steuert, ob der Zurück-Link auf #notes oder #projekte zeigt."
    type: int
    default: 0
    category: news

  footer.storagePid:
    label: "Footer Storage PID"
    description: "Die UID des Sysfolder-Ordners, in dem das Footer-Element liegt."
    type: int
    default: 0
    category: footer

  form.contact.recipientEmail:
    label: "Empfänger E-Mail"
    default: "your.email@example.com"
    type: string
    category: form.contact

  form.contact.recipientName:
    label: "Empfänger Name"
    default: "Portfolio"
    type: string
    category: form.contact

  form.contact.privacyPageUid:
    label: "Datenschutz-Seite (UID)"
    description: "UID der Datenschutzseite, die im Kontaktformular verlinkt wird."
    default: 0
    type: int
    category: form.contact
