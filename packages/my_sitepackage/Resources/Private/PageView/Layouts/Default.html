<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:v="http://typo3.org/ns/Praetorius/ViteAssetCollector/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <v:asset
        entry="EXT:my_sitepackage/Resources/Private/JavaScript/Main.entry.js"
    />

    <!-- Checkerboard background — 8px grid unit, purely decorative -->
    <div class="cb-perspective-grid" aria-hidden="true"></div>

    <header class="cb-nav" role="banner">
        <div class="container">
            <div class="cb-nav__bar">
                <a href="/" class="cb-nav__logo"> Maik Demuth </a>

                <button
                    class="cb-nav__toggle"
                    type="button"
                    aria-label="Menü öffnen"
                    aria-expanded="false"
                    aria-controls="cb-nav-overlay"
                >
                    <span class="cb-nav__toggle-line"></span>
                    <span class="cb-nav__toggle-line"></span>
                    <span class="cb-nav__toggle-line"></span>
                </button>

                <nav class="cb-nav__desktop" aria-label="Hauptnavigation">
                    <ul class="cb-nav__list">
                        <li class="cb-nav__item">
                            <f:if condition="{pageUid} == {site.rootPageId}">
                                <f:then>
                                    <a
                                        href="{f:uri.page(pageUid: site.rootPageId)}"
                                        class="cb-nav__link cb-nav__link--active"
                                        title="About me"
                                        >About me</a
                                    >
                                </f:then>
                                <f:else>
                                    <a
                                        href="{f:uri.page(pageUid: site.rootPageId)}"
                                        class="cb-nav__link"
                                        title="About me"
                                        >About me</a
                                    >
                                </f:else>
                            </f:if>
                        </li>
                        <f:for each="{mainnavigation}" as="item">
                            <f:if condition="{item.uid} != {site.rootPageId}">
                                <li class="cb-nav__item">
                                    <a
                                        href="{item.link}"
                                        class="cb-nav__link{f:if(condition: item.active, then: ' cb-nav__link--active active text-black')}"
                                        title="{item.title}"
                                    >
                                        {item.title}
                                    </a>
                                </li>
                            </f:if>
                        </f:for>
                        <li class="cb-nav__item">
                            <a
                                href="https://github.com/maikdemuth"
                                class="cb-nav__link cb-nav__link--icon"
                                target="_blank"
                                rel="noopener noreferrer"
                                aria-label="GitHub"
                                ><svg
                                    viewBox="0 0 24 24"
                                    fill="currentColor"
                                    width="16"
                                    height="16"
                                    aria-hidden="true"
                                >
                                    <path
                                        d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"
                                    /></svg
                            ></a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <div
        class="cb-nav__overlay"
        id="cb-nav-overlay"
        aria-hidden="true"
        role="dialog"
        aria-label="Navigation"
    >
        <nav aria-label="Hauptnavigation">
            <ul class="cb-nav__overlay-list">
                <li class="cb-nav__overlay-item">
                    <f:if condition="{pageUid} == {site.rootPageId}">
                        <f:then>
                            <a
                                href="{f:uri.page(pageUid: site.rootPageId)}"
                                class="cb-nav__overlay-link cb-nav__overlay-link--active"
                                title="About me"
                                >About me</a
                            >
                        </f:then>
                        <f:else>
                            <a
                                href="{f:uri.page(pageUid: site.rootPageId)}"
                                class="cb-nav__overlay-link"
                                title="About me"
                                >About me</a
                            >
                        </f:else>
                    </f:if>
                </li>
                <f:for each="{mainnavigation}" as="item">
                    <f:if condition="{item.uid} != {site.rootPageId}">
                        <li class="cb-nav__overlay-item">
                            <a
                                href="{item.link}"
                                class="cb-nav__overlay-link{f:if(condition: item.active, then: ' cb-nav__overlay-link--active')}"
                                title="{item.title}"
                            >
                                {item.title}
                            </a>
                        </li>
                    </f:if>
                </f:for>
            </ul>
        </nav>
    </div>

    <main>
        <f:render section="Main" />
    </main>

    <f:cObject typoscriptObjectPath="lib.footer" />
</html>
