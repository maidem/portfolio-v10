<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:v="http://typo3.org/ns/Praetorius/ViteAssetCollector/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <v:asset
        entry="EXT:my_sitepackage/Resources/Private/JavaScript/Main.entry.js"
    />

    <!-- Background typographic watermark — purely decorative, no semantic value -->
    <div class="cb-bg-text" aria-hidden="true">
        <span class="cb-bg-text__large">MAIK</span><span class="cb-bg-text__small">DEMUTH</span>
    </div>

    <header class="cb-nav" role="banner">
        <div class="container">
            <div class="cb-nav__bar">
                <a href="/" class="cb-nav__logo"> Maik Demuth </a>

                <button
                    class="cb-nav__toggle"
                    type="button"
                    aria-label="Menü öffnen"
                    aria-expanded="false"
                    aria-controls="cb-nav-overlay"
                >
                    <span class="cb-nav__toggle-line"></span>
                    <span class="cb-nav__toggle-line"></span>
                    <span class="cb-nav__toggle-line"></span>
                </button>

                <nav class="cb-nav__desktop" aria-label="Hauptnavigation">
                    <ul class="cb-nav__list">
                        <f:if condition="{sectionNavigation}">
                            <f:then>
                                <f:for each="{sectionNavigation}" as="section">
                                    <li class="cb-nav__item">
                                        <a
                                            href="#{section.data.section_anchor}"
                                            class="cb-nav__link"
                                            title="{section.data.header}"
                                        >
                                            {section.data.header}
                                        </a>
                                    </li>
                                </f:for>
                            </f:then>
                            <f:else>
                                <f:for each="{homeNavigation}" as="section">
                                    <li class="cb-nav__item">
                                        <a
                                            href="/#{section.data.section_anchor}"
                                            class="cb-nav__link"
                                            title="{section.data.header}"
                                        >
                                            {section.data.header}
                                        </a>
                                    </li>
                                </f:for>
                            </f:else>
                        </f:if>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <div
        class="cb-nav__overlay"
        id="cb-nav-overlay"
        aria-hidden="true"
        role="dialog"
        aria-label="Navigation"
    >
        <nav aria-label="Hauptnavigation">
            <ul class="cb-nav__overlay-list">
                <f:if condition="{sectionNavigation}">
                    <f:then>
                        <f:for each="{sectionNavigation}" as="section">
                            <li class="cb-nav__overlay-item">
                                <a
                                    href="#{section.data.section_anchor}"
                                    class="cb-nav__overlay-link"
                                    title="{section.data.header}"
                                >
                                    {section.data.header}
                                </a>
                            </li>
                        </f:for>
                    </f:then>
                    <f:else>
                        <f:for each="{homeNavigation}" as="section">
                            <li class="cb-nav__overlay-item">
                                <a
                                    href="/#{section.data.section_anchor}"
                                    class="cb-nav__overlay-link"
                                    title="{section.data.header}"
                                >
                                    {section.data.header}
                                </a>
                            </li>
                        </f:for>
                    </f:else>
                </f:if>
            </ul>
        </nav>
    </div>

    <main>
        <f:render section="Main" />
    </main>

    <f:cObject typoscriptObjectPath="lib.footer" />
</html>
