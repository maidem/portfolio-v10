<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:v="http://typo3.org/ns/Praetorius/ViteAssetCollector/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <v:asset
        entry="EXT:my_sitepackage/Resources/Private/JavaScript/Main.entry.js"
    />

    <f:comment>ponytail: bei Aufruf mit #hash sofort dort stehen statt hinzuscrollen; smooth bleibt fuer Klicks auf der Seite</f:comment>
    <script>
        document.documentElement.classList.add('is-loading');
        addEventListener('load', function () {
            requestAnimationFrame(function () {
                document.documentElement.classList.remove('is-loading');
            });
        });
    </script>

    <!-- White background fill — sits below perspective grid -->
    <div class="cb-bg-fill" aria-hidden="true"></div>

    <!-- Perspective grid background — decorative radiating lines.
         Kritische Positionierung steht inline im <head> (page.typoscript
         headerData 40), damit das SVG nicht bis zum Vite-CSS ungestylt
         aufblitzt. -->
    <div class="cb-perspective-grid" aria-hidden="true">
        <svg
            viewBox="0 0 1440 900"
            preserveAspectRatio="xMidYMid slice"
            xmlns="http://www.w3.org/2000/svg"
        >
            <g stroke="rgb(90, 90, 90)" stroke-width="1" stroke-opacity="0.18" fill="none">
                <line x1="720" y1="0" x2="0" y2="900" />
                <line x1="720" y1="0" x2="120" y2="900" />
                <line x1="720" y1="0" x2="240" y2="900" />
                <line x1="720" y1="0" x2="360" y2="900" />
                <line x1="720" y1="0" x2="480" y2="900" />
                <line x1="720" y1="0" x2="600" y2="900" />
                <line x1="720" y1="0" x2="720" y2="900" />
                <line x1="720" y1="0" x2="840" y2="900" />
                <line x1="720" y1="0" x2="960" y2="900" />
                <line x1="720" y1="0" x2="1080" y2="900" />
                <line x1="720" y1="0" x2="1200" y2="900" />
                <line x1="720" y1="0" x2="1320" y2="900" />
                <line x1="720" y1="0" x2="1440" y2="900" />
            </g>
            <g stroke="rgb(90, 90, 90)" stroke-width="1" stroke-opacity="0.1" fill="none">
                <line x1="720" y1="0" x2="0" y2="900" />
                <line x1="720" y1="0" x2="120" y2="900" />
                <line x1="720" y1="0" x2="240" y2="900" />
                <line x1="720" y1="0" x2="360" y2="900" />
                <line x1="720" y1="0" x2="480" y2="900" />
                <line x1="720" y1="0" x2="600" y2="900" />
                <line x1="720" y1="0" x2="720" y2="900" />
                <line x1="720" y1="0" x2="840" y2="900" />
                <line x1="720" y1="0" x2="960" y2="900" />
                <line x1="720" y1="0" x2="1080" y2="900" />
                <line x1="720" y1="0" x2="1200" y2="900" />
                <line x1="720" y1="0" x2="1320" y2="900" />
                <line x1="720" y1="0" x2="1440" y2="900" />
            </g>
        </svg>
    </div>

    <header class="cb-nav" role="banner">
        <div class="cb-nav__container">
            <div class="cb-nav__bar">
                <a href="/" class="cb-nav__logo">
                    <span>Maik Demuth</span>
                </a>

                <button
                    class="cb-nav__toggle"
                    type="button"
                    aria-label="Menü öffnen"
                    aria-expanded="false"
                    aria-controls="cb-nav-overlay"
                >
                    <span class="cb-nav__toggle-line"></span>
                    <span class="cb-nav__toggle-line"></span>
                    <span class="cb-nav__toggle-line"></span>
                </button>

                <nav class="cb-nav__desktop" aria-label="Hauptnavigation">
                    <f:for each="{mainnavigation}" as="item" iteration="i">
                        <f:if condition="{item.uid} != {site.rootPageId}">
                            <f:if condition="!{i.isFirst}">
                                <span class="cb-nav__sep" aria-hidden="true">/</span>
                            </f:if>
                            <a
                                href="{item.link}"
                                class="cb-nav__link{f:if(condition: item.active, then: ' cb-nav__link--active active')}"
                                title="{item.title}"
                            >{item.title}</a>
                        </f:if>
                    </f:for>
                    <span class="cb-nav__sep" aria-hidden="true">/</span>
                    <a
                        href="https://github.com/maidem"
                        class="cb-nav__link cb-nav__link--icon"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="GitHub-Profil (öffnet in neuem Tab)"
                    >
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                        </svg>
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Mobile nav backdrop (click to close) -->
    <div class="cb-nav__backdrop" id="cb-nav-backdrop" aria-hidden="true"></div>

    <!-- Mobile nav bottom sheet -->
    <div
        class="cb-nav__overlay"
        id="cb-nav-overlay"
        aria-hidden="true"
        role="dialog"
        aria-label="Navigation"
    >
        <div class="cb-nav__sheet-handle" aria-hidden="true"></div>
        <nav aria-label="Hauptnavigation">
            <ul class="cb-nav__overlay-list">
                <f:for each="{mainnavigation}" as="item">
                    <f:if condition="{item.uid} != {site.rootPageId}">
                        <li class="cb-nav__overlay-item">
                            <a
                                href="{item.link}"
                                class="cb-nav__overlay-link{f:if(condition: item.active, then: ' cb-nav__overlay-link--active')}"
                                title="{item.title}"
                            >
                                {item.title}
                            </a>
                        </li>
                    </f:if>
                </f:for>
                <li class="cb-nav__overlay-item">
                    <a
                        href="https://github.com/maidem"
                        class="cb-nav__overlay-link"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        GitHub
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <main>
        <f:render section="Main" />
    </main>

    <f:cObject typoscriptObjectPath="lib.footer" />
</html>
