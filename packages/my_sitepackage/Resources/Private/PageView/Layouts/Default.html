<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:v="http://typo3.org/ns/Praetorius/ViteAssetCollector/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <v:asset
        entry="EXT:my_sitepackage/Resources/Private/JavaScript/Main.entry.js"
    />

    <!-- Checkerboard background — 8px grid unit, purely decorative -->
    <div class="cb-perspective-grid" aria-hidden="true"></div>

    <header class="cb-nav" role="banner">
        <div class="container">
            <div class="cb-nav__bar">
                <a href="/" class="cb-nav__logo"> Maik Demuth </a>

                <button
                    class="cb-nav__toggle"
                    type="button"
                    aria-label="Menü öffnen"
                    aria-expanded="false"
                    aria-controls="cb-nav-overlay"
                >
                    <span class="cb-nav__toggle-line"></span>
                    <span class="cb-nav__toggle-line"></span>
                    <span class="cb-nav__toggle-line"></span>
                </button>

                <nav class="cb-nav__desktop" aria-label="Hauptnavigation">
                    <ul class="cb-nav__list">
                        <li class="cb-nav__item">
                            <f:if condition="{pageUid} == {site.rootPageId}">
                                <f:then>
                                    <a
                                        href="{f:uri.page(pageUid: site.rootPageId)}"
                                        class="cb-nav__link cb-nav__link--active"
                                        title="{settings.nav.homeTitle}"
                                        >{settings.nav.homeTitle}</a
                                    >
                                </f:then>
                                <f:else>
                                    <a
                                        href="{f:uri.page(pageUid: site.rootPageId)}"
                                        class="cb-nav__link"
                                        title="{settings.nav.homeTitle}"
                                        >{settings.nav.homeTitle}</a
                                    >
                                </f:else>
                            </f:if>
                        </li>
                        <f:for each="{mainnavigation}" as="item">
                            <f:if condition="{item.uid} != {site.rootPageId}">
                                <li class="cb-nav__item">
                                    <a
                                        href="{item.link}"
                                        class="cb-nav__link{f:if(condition: item.active, then: ' cb-nav__link--active active text-black')}"
                                        title="{item.title}"
                                    >
                                        {item.title}
                                    </a>
                                </li>
                            </f:if>
                        </f:for>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <div
        class="cb-nav__overlay"
        id="cb-nav-overlay"
        aria-hidden="true"
        role="dialog"
        aria-label="Navigation"
    >
        <nav aria-label="Hauptnavigation">
            <ul class="cb-nav__overlay-list">
                <li class="cb-nav__overlay-item">
                    <f:if condition="{pageUid} == {site.rootPageId}">
                        <f:then>
                            <a
                                href="{f:uri.page(pageUid: site.rootPageId)}"
                                class="cb-nav__overlay-link cb-nav__overlay-link--active"
                                title="{settings.nav.homeTitle}"
                                >{settings.nav.homeTitle}</a
                            >
                        </f:then>
                        <f:else>
                            <a
                                href="{f:uri.page(pageUid: site.rootPageId)}"
                                class="cb-nav__overlay-link"
                                title="{settings.nav.homeTitle}"
                                >{settings.nav.homeTitle}</a
                            >
                        </f:else>
                    </f:if>
                </li>
                <f:for each="{mainnavigation}" as="item">
                    <f:if condition="{item.uid} != {site.rootPageId}">
                        <li class="cb-nav__overlay-item">
                            <a
                                href="{item.link}"
                                class="cb-nav__overlay-link{f:if(condition: item.active, then: ' cb-nav__overlay-link--active')}"
                                title="{item.title}"
                            >
                                {item.title}
                            </a>
                        </li>
                    </f:if>
                </f:for>
            </ul>
        </nav>
    </div>

    <main>
        <f:render section="Main" />
    </main>

    <f:cObject typoscriptObjectPath="lib.footer" />
</html>
