
identifier: contact
type: Form
label: contact
prototypeName: standard
renderingOptions:
  submitButtonLabel: Absenden
  translation:
    translationFiles:
      - 'EXT:my_sitepackage/Resources/Private/Language/locallang_form_contact.xlf'
finishers:
  -
    options:
      subject: 'Neue Kontaktanfrage von {name}'
      recipients:
        connect@maidem.de: Maik
      senderAddress: connect@maidem.de
      senderName: 'Portfolio Kontaktformular'
      replyToRecipients:
        - '{email}'
    identifier: EmailToReceiver
  -
    options:
      pageUid: 1
      additionalParameters: contact=sent
    identifier: Redirect
renderables:
  -
    renderingOptions:
      previousButtonLabel: Zurück
      nextButtonLabel: Weiter
    identifier: page-1
    label: 'Sag Hallo!'
    type: Page
    renderables:
      -
        defaultValue: ''
        identifier: name
        label: Name
        type: Text
        properties:
          fluidAdditionalAttributes:
            placeholder: Name
            autocomplete: name
            required: required
        validators:
          -
            identifier: NotEmpty
      -
        defaultValue: ''
        identifier: email
        label: E-Mail
        type: Email
        properties:
          fluidAdditionalAttributes:
            placeholder: E-Mail-Adresse
            autocomplete: email
            required: required
        validators:
          -
            identifier: NotEmpty
          -
            identifier: EmailAddress
      -
        defaultValue: ''
        identifier: message
        label: Nachricht
        type: Textarea
        properties:
          fluidAdditionalAttributes:
            placeholder: 'Deine Nachricht...'
            required: required
        validators:
          -
            identifier: NotEmpty
      -
        identifier: privacy
        type: Checkbox
        properties:
          privacyPageUid: ''
        validators:
          -
            identifier: NotEmpty
      -
        defaultValue: ''
        properties:
          selectedProject: Default
        type: MosparoCaptcha
        identifier: mosparocaptcha-1
        label: 'Mosparo Captcha'
        validators:
          -
            identifier: MosparoCaptchaValidator
variants: {  }
