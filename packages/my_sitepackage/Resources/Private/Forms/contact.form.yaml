identifier: contact
type: Form
label: contact
prototypeName: standard
renderingOptions:
  submitButtonLabel: Absenden
  translation:
    translationFiles:
      10: "EXT:my_sitepackage/Resources/Private/Language/locallang_form_contact.xlf"
finishers:
  - options:
      subject: "Nachricht von portfolio-v1: {subject}"
      recipients:
        "{$form.contact.recipientEmail}": "{$form.contact.recipientName}"
      senderAddress: "{email}"
      senderName: "{name}"
      format: html
      attachUploads: true
      translation:
        language: default
      title: "Bestätigung deiner Nachricht"
    identifier: EmailToReceiver
renderables:
  - renderingOptions:
      previousButtonLabel: "Zurück"
      nextButtonLabel: "Weiter"
    identifier: page-1
    label: "Kontaktformular"
    type: Page
    renderables:
      - defaultValue: ""
        identifier: name
        label: Name
        type: Text
        properties:
          fluidAdditionalAttributes:
            placeholder: Name
            autocomplete: name
            required: required
        validators:
          - identifier: NotEmpty
      - defaultValue: ""
        identifier: subject
        label: Betreff
        type: Text
        properties:
          fluidAdditionalAttributes:
            placeholder: Betreff
            required: required
        validators:
          - identifier: NotEmpty
      - defaultValue: ""
        identifier: email
        label: E-Mail
        type: Email
        properties:
          fluidAdditionalAttributes:
            placeholder: "E-Mail-Adresse"
            autocomplete: email
            required: required
        validators:
          - identifier: NotEmpty
          - identifier: EmailAddress
      - defaultValue: ""
        identifier: message
        label: Nachricht
        type: Textarea
        properties:
          fluidAdditionalAttributes:
            placeholder: "Deine Nachricht..."
            required: required
        validators:
          - identifier: NotEmpty
      - identifier: privacy
        type: Checkbox
        label: "Ja, ich habe die "
        properties:
          privacyPageUid: "{$form.contact.privacyPageUid}"
          privacyLinkText: "Datenschutzerklärung"
          labelSuffix: " zur Kenntnis genommen und bin damit einverstanden, dass die von mir angegebenen Daten elektronisch erhoben und gespeichert werden. Meine Daten werden dabei nur streng zweckgebunden zur Bearbeitung und Beantwortung meiner Anfrage genutzt."
        validators:
          - identifier: NotEmpty
      - defaultValue: ""
        identifier: math
        type: MathCaptcha
        label: Sicherheitsabfrage
        properties:
          fluidAdditionalAttributes:
            required: required
        validators:
          - identifier: NotEmpty
          - identifier: MathCaptcha
            options:
              formIdentifier: contact
