
identifier: contact
type: Form
label: contact
prototypeName: standard
renderingOptions:
  submitButtonLabel: Absenden
  # Locale explizit auf Deutsch festnageln: bei einem POST-Submit ohne
  # Sprach-Präfix in der URL erkennt der Form-TranslationService den Locale
  # sonst als "en" und zeigt englische Validierungs-Fallbacks statt der
  # deutschen Übersetzungen aus den translationFiles.
  language: de
  translation:
    language: de
    translationFiles:
      - 'EXT:my_sitepackage/Resources/Private/Language/locallang_form_contact.xlf'
finishers:
  -
    options:
      subject: 'Neue Kontaktanfrage von {name}'
      recipients:
        connect@maidem.de: Maik
      senderAddress: connect@maidem.de
      senderName: 'Portfolio Kontaktformular'
      replyToRecipients:
        - '{email}'
      addHtmlPart: false
      templateName: Receiver
      templateRootPaths:
        20: 'EXT:my_sitepackage/Resources/Private/Email/Templates/'
    identifier: EmailToReceiver
  -
    options:
      subject: 'Bestätigung deiner Kontaktanfrage an Maik Demuth'
      recipients:
        '{email}': '{name}'
      senderAddress: connect@maidem.de
      senderName: 'Portfolio Kontaktformular'
      templateName: Confirmation
      variables:
        contactName: Maik Demuth
        contactStreet: 'Gebrüder-Grimm-Str. 5'
        contactCity: '65520 Bad Camberg'
        contactEmail: connect@maidem.de
        contactPhone: '+49 151 64 89 85 15'
    identifier: EmailToSender
  -
    options:
      pageUid: 1
      additionalParameters: contact=sent
    identifier: Redirect
renderables:
  -
    renderingOptions:
      previousButtonLabel: Zurück
      nextButtonLabel: Weiter
    identifier: page-1
    label: 'Sag Hallo!'
    type: Page
    renderables:
      -
        defaultValue: ''
        identifier: name
        label: Name
        type: Text
        properties:
          fluidAdditionalAttributes:
            placeholder: Name
            autocomplete: name
            required: required
        validators:
          -
            identifier: NotEmpty
      -
        defaultValue: ''
        identifier: email
        label: E-Mail
        type: Email
        properties:
          fluidAdditionalAttributes:
            placeholder: E-Mail-Adresse
            autocomplete: email
            required: required
        validators:
          -
            identifier: NotEmpty
          -
            identifier: EmailAddress
      -
        defaultValue: ''
        identifier: message
        label: Nachricht
        type: Textarea
        properties:
          fluidAdditionalAttributes:
            placeholder: 'Deine Nachricht...'
            required: required
        validators:
          -
            identifier: NotEmpty
      -
        identifier: privacy
        type: Checkbox
        properties:
          privacyPageUid: ''
        validators:
          -
            identifier: NotEmpty
            options:
              nullMessage: 'Dieses Feld ist erforderlich.'
              emptyMessage: 'Dieses Feld ist erforderlich.'
      -
        defaultValue: ''
        properties:
          selectedProject: Default
        type: MosparoCaptcha
        identifier: mosparocaptcha-1
        label: 'Mosparo Captcha'
        validators:
          -
            identifier: MosparoCaptchaValidator
variants: {  }
