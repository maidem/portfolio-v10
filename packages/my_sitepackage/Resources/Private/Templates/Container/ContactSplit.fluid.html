<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <f:layout name="Default" />
    <f:section name="Main">
        <section class="cb-form-section">
        <div class="cb-contact-split">
            <aside class="cb-contact-split__aside">
                <f:for each="{leftChildren}" as="child">
                    {child.renderedContent -> f:format.raw()}
                </f:for>
            </aside>
            <div class="cb-contact-split__main">
                <f:for each="{rightChildren}" as="child">
                    {child.renderedContent -> f:format.raw()}
                </f:for>
            </div>
        </div>
        </section>
    </f:section>
</html>
