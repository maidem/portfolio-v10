<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <f:layout name="Default" />

    <f:section name="content">
        <div class="cb-news-list" id="cb-news-list" data-pdf-group-scope>
            <div class="cb-card">
                <div class="cb-card__body">
                    <f:if condition="{news}">
                        <f:then>
                            <f:for each="{news}" as="newsItem">
                                <f:render
                                    partial="List/Item"
                                    arguments="{newsItem: newsItem, settings: settings}"
                                />
                            </f:for>
                            <div class="cb-news-list__pdf-action">
                                <button
                                    class="cb-pdf-add-btn"
                                    type="button"
                                    data-pdf-group
                                    aria-pressed="false"
                                >
                                    <span class="cb-pdf-add-btn__label"
                                        >Alle zum PDF-Dossier hinzufügen</span
                                    >
                                </button>
                            </div>
                        </f:then>
                        <f:else>
                            <p class="cb-news-empty">
                                Keine Einträge vorhanden.
                            </p>
                        </f:else>
                    </f:if>
                </div>
            </div>
        </div>

    </f:section>
</html>
