<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <f:layout name="Default" />

    <f:section name="content">
        <f:if condition="{newsItem}">
            <n:format.nothing>
                <n:excludeDisplayedNews newsItem="{newsItem}" />
                <f:if condition="{newsItem.alternativeTitle}">
                    <f:then>
                        <n:titleTag>
                            <f:format.htmlentitiesDecode
                                >{newsItem.alternativeTitle}</f:format.htmlentitiesDecode
                            >
                        </n:titleTag>
                    </f:then>
                    <f:else>
                        <n:titleTag>
                            <f:format.htmlentitiesDecode
                                >{newsItem.title}</f:format.htmlentitiesDecode
                            >
                        </n:titleTag>
                    </f:else>
                </f:if>
            </n:format.nothing>

            <div
                class="container cb-news-detail"
                id="news-{newsItem.uid}"
                data-article-uid="{newsItem.uid}"
            >
                <div class="cb-news-detail__inner">
                    <!-- ── Header Block ───────────────────────────────────────────── -->
                    <div class="row mb-4 pb-4 cb-news-detail__header-row">
                        <div class="col-12">
                            <!-- Back navigation -->
                            <a
                                href="#"
                                class="cb-news-article-back mb-3 d-inline-block cb-back-to-list"
                            >
                                ← Zurück
                            </a>

                            <!-- Date -->
                            <f:if condition="{newsItem.datetime}">
                                <span class="cb-news-article-date d-block mb-3">
                                    <f:format.date
                                        pattern="dd. MMMM yyyy"
                                        locale="de-DE"
                                        >{newsItem.datetime}</f:format.date
                                    >
                                </span>
                            </f:if>

                            <!-- Category labels -->
                            <f:for each="{newsItem.categories}" as="cat">
                                <span class="cb-news-category-label"
                                    >{cat.title}</span
                                >
                            </f:for>

                            <!-- Title -->
                            <h1 class="cb-news-article-title-top mb-3">
                                {newsItem.title}
                            </h1>

                            <!-- Teaser -->
                            <f:if condition="{newsItem.teaser}">
                                <p class="cb-news-article-teaser mb-0">
                                    {newsItem.teaser}
                                </p>
                            </f:if>

                            <!-- External project URL -->
                            <f:if condition="{newsItem.externalurl}">
                                <div class="mt-3">
                                    <a
                                        href="{newsItem.externalurl}"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        class="cb-project-article-website-link"
                                    >
                                        Website besuchen →
                                    </a>
                                </div>
                            </f:if>

                            <!-- PDF export button -->
                            <div class="mt-3">
                                <button
                                    class="cb-pdf-add-btn"
                                    type="button"
                                    data-pdf-section="news_{newsItem.uid}"
                                    aria-pressed="false"
                                >
                                    <span class="cb-pdf-add-btn__label"
                                        >Zu PDF-Export hinzufügen</span
                                    >
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- ── Main Content: Sidebar + Body ───────────────────────────── -->
                    <div class="row g-5">
                        <!-- Sidebar (sticky TOC, hidden on mobile) -->
                        <div class="col-md-4 d-none d-md-block">
                            <div class="cb-sidebar">
                                <div
                                    class="cb-toc-minimal"
                                    id="cb-news-toc-{newsItem.uid}"
                                ></div>
                            </div>
                        </div>

                        <!-- Bodytext -->
                        <div class="col-md-8">
                            <div class="cb-news-article-body">
                                <!-- Media (images, video) -->
                                <f:if condition="{newsItem.falMedia}">
                                    <div class="cb-news-detail__media mb-4">
                                        <f:for
                                            each="{newsItem.falMedia}"
                                            as="media"
                                            iteration="mediaIter"
                                        >
                                            <f:if
                                                condition="{mediaIter.isFirst}"
                                            >
                                                <f:image
                                                    image="{media}"
                                                    alt="{media.properties.alternative}"
                                                    title="{media.properties.title}"
                                                    class="img-fluid rounded mb-3"
                                                    loading="lazy"
                                                />
                                            </f:if>
                                        </f:for>
                                    </div>
                                </f:if>

                                <!-- HTML bodytext -->
                                <f:if condition="{newsItem.bodytext}">
                                    <f:format.html
                                        >{newsItem.bodytext}</f:format.html
                                    >
                                </f:if>

                                <!-- Content elements (if any are attached to the news record) -->
                                <f:if condition="{newsItem.contentElements}">
                                    <f:cObject
                                        typoscriptObjectPath="lib.tx_news.contentElementRendering"
                                    >
                                        {newsItem.contentElementIdList}
                                    </f:cObject>
                                </f:if>
                            </div>
                        </div>
                    </div>

                    <!-- ── Prev / Next Navigation ──────────────────────────────────── -->
                    <n:simplePrevNext
                        pidList="{newsItem.pid}"
                        news="{newsItem}"
                        as="prevNext"
                        sortField="datetime"
                    >
                        <nav
                            class="cb-article-nav"
                            aria-label="Weitere Artikel"
                        >
                            <div class="cb-article-nav__inner">
                                <div
                                    class="cb-article-nav__item cb-article-nav__item--prev"
                                >
                                    <f:if condition="{prevNext.prev}">
                                        <n:link
                                            newsItem="{prevNext.prev}"
                                            settings="{settings}"
                                            class="cb-article-nav__link"
                                        >
                                            <span class="cb-article-nav__label"
                                                >← Vorheriger Artikel</span
                                            >
                                            <span class="cb-article-nav__title"
                                                >{prevNext.prev.title}</span
                                            >
                                        </n:link>
                                    </f:if>
                                </div>

                                <div class="cb-article-nav__overview">
                                    <a
                                        class="cb-article-nav__overview-link cb-back-to-list"
                                        href="#"
                                        aria-label="Zur Übersicht"
                                        >Übersicht</a
                                    >
                                </div>

                                <div
                                    class="cb-article-nav__item cb-article-nav__item--next"
                                >
                                    <f:if condition="{prevNext.next}">
                                        <n:link
                                            newsItem="{prevNext.next}"
                                            settings="{settings}"
                                            class="cb-article-nav__link"
                                        >
                                            <span class="cb-article-nav__label"
                                                >Nächster Artikel →</span
                                            >
                                            <span class="cb-article-nav__title"
                                                >{prevNext.next.title}</span
                                            >
                                        </n:link>
                                    </f:if>
                                </div>
                            </div>
                        </nav>
                    </n:simplePrevNext>

                    <script>
                        (function () {
                            var parts = location.pathname
                                .split("/")
                                .filter(Boolean);
                            parts.pop();
                            var listUrl = parts.length
                                ? "/" + parts.join("/")
                                : "/";
                            document
                                .querySelectorAll(".cb-back-to-list")
                                .forEach(function (el) {
                                    el.href = listUrl;
                                });
                        })();
                    </script>
                </div>
            </div>
        </f:if>
    </f:section>
</html>
