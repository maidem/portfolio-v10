<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <f:layout name="Default" />

    <f:section name="content">
        <f:if condition="{newsItem}">
            <n:format.nothing>
                <n:excludeDisplayedNews newsItem="{newsItem}" />
                <f:if condition="{newsItem.alternativeTitle}">
                    <f:then>
                        <n:titleTag>
                            <f:format.htmlentitiesDecode
                                >{newsItem.alternativeTitle}</f:format.htmlentitiesDecode
                            >
                        </n:titleTag>
                    </f:then>
                    <f:else>
                        <n:titleTag>
                            <f:format.htmlentitiesDecode
                                >{newsItem.title}</f:format.htmlentitiesDecode
                            >
                        </n:titleTag>
                    </f:else>
                </f:if>
            </n:format.nothing>

            <article
                class="cb-news-detail"
                id="news-{newsItem.uid}"
                data-article-uid="{newsItem.uid}"
            >
                <div class="cb-news-detail__inner">
                    <header class="cb-news-detail__header">
                        <a
                            href="#"
                            class="cb-news-article-back cb-back-to-list"
                        >
                            ← Zurück
                        </a>

                        <f:if condition="{newsItem.datetime}">
                            <time
                                class="cb-news-article-date"
                                datetime="{f:format.date(pattern: 'yyyy-MM-dd', date: newsItem.datetime)}"
                            >
                                <f:format.date
                                    pattern="dd. MMMM yyyy"
                                    locale="de-DE"
                                    >{newsItem.datetime}</f:format.date
                                >
                            </time>
                        </f:if>

                        <f:if condition="{newsItem.categories}">
                            <ul class="cb-news-categories">
                                <f:for each="{newsItem.categories}" as="cat">
                                    <li class="cb-news-category-label">{cat.title}</li>
                                </f:for>
                            </ul>
                        </f:if>

                        <h1 class="cb-news-article-title-top">
                            {newsItem.title}
                        </h1>

                        <f:if condition="{newsItem.teaser}">
                            <p class="cb-news-article-teaser">
                                {newsItem.teaser}
                            </p>
                        </f:if>

                        <f:if condition="{newsItem.externalurl}">
                            <p class="cb-news-detail__external-link">
                                <a
                                    href="{newsItem.externalurl}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="cb-project-article-website-link"
                                >
                                    Website besuchen →
                                </a>
                            </p>
                        </f:if>

                        <div class="cb-news-detail__pdf-btn">
                            <button
                                class="cb-pdf-add-btn"
                                type="button"
                                data-pdf-section="news_{newsItem.uid}"
                                aria-pressed="false"
                            >
                                <span class="cb-pdf-add-btn__label"
                                    >Zu PDF-Export hinzufügen</span
                                >
                            </button>
                        </div>
                    </header>

                    <div class="cb-news-detail__body">
                        <aside class="cb-news-detail__sidebar">
                            <div class="cb-sidebar">
                                <div
                                    class="cb-toc-minimal"
                                    id="cb-news-toc-{newsItem.uid}"
                                ></div>
                            </div>
                        </aside>

                        <div class="cb-news-detail__content">
                            <div class="cb-news-article-body">
                                <f:if condition="{newsItem.falMedia}">
                                    <figure class="cb-news-detail__media">
                                        <f:for
                                            each="{newsItem.falMedia}"
                                            as="media"
                                            iteration="mediaIter"
                                        >
                                            <f:if condition="{mediaIter.isFirst}">
                                                <f:image
                                                    image="{media}"
                                                    alt="{media.properties.alternative}"
                                                    title="{media.properties.title}"
                                                    class="cb-img-fluid"
                                                    loading="lazy"
                                                />
                                            </f:if>
                                        </f:for>
                                    </figure>
                                </f:if>

                                <f:if condition="{newsItem.bodytext}">
                                    <f:format.html>{newsItem.bodytext}</f:format.html>
                                </f:if>

                                <f:if condition="{newsItem.contentElements}">
                                    <f:cObject
                                        typoscriptObjectPath="lib.tx_news.contentElementRendering"
                                    >
                                        {newsItem.contentElementIdList}
                                    </f:cObject>
                                </f:if>
                            </div>
                        </div>
                    </div>

                    <n:simplePrevNext
                        pidList="{newsItem.pid}"
                        news="{newsItem}"
                        as="prevNext"
                        sortField="datetime"
                    >
                        <nav
                            class="cb-article-nav"
                            aria-label="Weitere Artikel"
                        >
                            <div class="cb-article-nav__inner">
                                <div class="cb-article-nav__item cb-article-nav__item--prev">
                                    <f:if condition="{prevNext.prev}">
                                        <n:link
                                            newsItem="{prevNext.prev}"
                                            settings="{settings}"
                                            class="cb-article-nav__link"
                                        >
                                            <span class="cb-article-nav__label">← Vorheriger Artikel</span>
                                            <span class="cb-article-nav__title">{prevNext.prev.title}</span>
                                        </n:link>
                                    </f:if>
                                </div>

                                <div class="cb-article-nav__overview">
                                    <a
                                        class="cb-article-nav__overview-link cb-back-to-list"
                                        href="#"
                                        aria-label="Zur Übersicht"
                                        >Übersicht</a
                                    >
                                </div>

                                <div class="cb-article-nav__item cb-article-nav__item--next">
                                    <f:if condition="{prevNext.next}">
                                        <n:link
                                            newsItem="{prevNext.next}"
                                            settings="{settings}"
                                            class="cb-article-nav__link"
                                        >
                                            <span class="cb-article-nav__label">Nächster Artikel →</span>
                                            <span class="cb-article-nav__title">{prevNext.next.title}</span>
                                        </n:link>
                                    </f:if>
                                </div>
                            </div>
                        </nav>
                    </n:simplePrevNext>

                    <script>
                        (function () {
                            var parts = location.pathname
                                .split("/")
                                .filter(Boolean);
                            parts.pop();
                            var listUrl = parts.length
                                ? "/" + parts.join("/")
                                : "/";
                            document
                                .querySelectorAll(".cb-back-to-list")
                                .forEach(function (el) {
                                    el.href = listUrl;
                                });
                        })();
                    </script>
                </div>
            </article>
        </f:if>
    </f:section>
</html>
