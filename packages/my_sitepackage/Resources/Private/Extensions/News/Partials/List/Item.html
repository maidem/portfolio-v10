<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <n:excludeDisplayedNews newsItem="{newsItem}" />

    <div class="cb-news-item">
        <div class="row gx-md-4 align-items-baseline">
            <!-- Date column -->
            <div class="col-12 col-md-4">
                <f:if condition="{newsItem.datetime}">
                    <span class="cb-news-date text-uppercase font-monospace">
                        <f:format.date pattern="dd. MMMM yyyy" locale="de-DE"
                            >{newsItem.datetime}</f:format.date
                        >
                    </span>
                </f:if>
            </div>

            <!-- Content column -->
            <div class="col-12 col-md-8">
                <!-- Category labels -->
                <f:for each="{newsItem.categories}" as="cat">
                    <span class="cb-news-category-label">{cat.title}</span>
                </f:for>

                <h3 class="cb-news-title fw-normal mb-1">{newsItem.title}</h3>

                <f:if condition="{newsItem.teaser}">
                    <p class="cb-news-teaser text-muted mb-2">
                        {newsItem.teaser}
                    </p>
                </f:if>

                <div class="d-flex align-items-center gap-3 flex-wrap">
                    <n:link
                        newsItem="{newsItem}"
                        settings="{settings}"
                        class="cb-news-link text-uppercase font-monospace text-dark stretched-link"
                    >
                        Weiterlesen →
                    </n:link>

                    <!-- External project URL (only shown for project-type articles) -->
                    <f:if condition="{newsItem.externalurl}">
                        <a
                            href="{newsItem.externalurl}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="cb-news-website-link text-uppercase font-monospace"
                            style="position: relative; z-index: 1"
                        >
                            Website →
                        </a>
                    </f:if>
                </div>
            </div>
        </div>
    </div>
</html>
