<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <n:excludeDisplayedNews newsItem="{newsItem}" />

    <article
        class="cb-news-item"
        data-pdf-item="news_{newsItem.uid}"
        data-pdf-item-label="{newsItem.title}"
    >
        <div class="cb-news-item__row">
            <f:if condition="{newsItem.falMedia}">
                <div class="cb-news-item__media">
                    <f:image
                        image="{newsItem.falMedia.0}"
                        maxWidth="320"
                        class="cb-news-item__img"
                        alt="{newsItem.title}"
                    />
                </div>
            </f:if>

            <div class="cb-news-item__content-col">
                <f:if condition="{newsItem.categories}">
                    <ul class="cb-news-categories">
                        <f:for each="{newsItem.categories}" as="cat">
                            <li class="cb-news-category-label">{cat.title}</li>
                        </f:for>
                    </ul>
                </f:if>

                <h3 class="cb-news-title">{newsItem.title}</h3>

                <f:if condition="{newsItem.teaser}">
                    <p class="cb-news-teaser">
                        {newsItem.teaser}
                    </p>
                </f:if>

                <div class="cb-news-item__actions">
                    <n:link
                        newsItem="{newsItem}"
                        settings="{settings}"
                        class="cb-news-link cb-stretched-link"
                    >
                        Weiterlesen →
                    </n:link>

                    <f:if condition="{newsItem.externalurl}">
                        <a
                            href="{newsItem.externalurl}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="cb-news-website-link"
                            style="position: relative; z-index: 1"
                        >
                            Website →
                        </a>
                    </f:if>
                </div>
            </div>
        </div>
    </article>
</html>
