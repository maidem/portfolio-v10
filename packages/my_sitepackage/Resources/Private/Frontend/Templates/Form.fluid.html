<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:formvh="http://typo3.org/ns/TYPO3/CMS/Form/ViewHelpers"
    xmlns:vite="http://typo3.org/ns/Praetorius/ViteAssetCollector/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <formvh:renderRenderable renderable="{form}">
        <vite:asset
            entry="EXT:my_sitepackage/Resources/Private/Frontend/Form.entry.scss"
        />
        <div
            class="container"
            id="{f:if(condition: data.section_anchor, then: data.section_anchor, else: 'contact')}"
        >
            <div class="cb-card">
                <div class="cb-card__label-bar">
                    <f:if condition="{data.header}">
                        <f:then>{data.header}</f:then>
                        <f:else>Kontakt</f:else>
                    </f:if>
                </div>
                <div class="cb-card__body">
                    <div class="row gx-md-4">
                        <div class="col-12 col-md-4">
                            <!-- intentionally empty label column -->
                        </div>
                        <div class="col-12 col-md-8 cb-form">
                            <formvh:form
                                object="{form}"
                                action="{form.renderingOptions.controllerAction}"
                                method="{form.renderingOptions.httpMethod}"
                                id="{form.identifier}"
                                section="{form.identifier}"
                                enctype="{form.renderingOptions.httpEnctype}"
                                addQueryString="{form.renderingOptions.addQueryString}"
                                argumentsToBeExcludedFromQueryString="{form.renderingOptions.argumentsToBeExcludedFromQueryString}"
                                additionalParams="{form.renderingOptions.additionalParams}"
                                additionalAttributes="{formvh:translateElementProperty(element: form, property: 'fluidAdditionalAttributes')}"
                                novalidate="novalidate"
                            >
                                <f:render
                                    partial="{form.currentPage.templateName}"
                                    arguments="{page: form.currentPage}"
                                />
                                <div
                                    class="{form.renderingOptions.formNavigation.navigationWrapperClassAttribute}"
                                >
                                    <f:render
                                        partial="Form/Navigation"
                                        arguments="{form: form}"
                                    />
                                </div>
                            </formvh:form>
                        </div>
                    </div>
                </div>
            </div>

            <div
                class="modal fade"
                id="privacyModal"
                tabindex="-1"
                aria-labelledby="privacyModalLabel"
                aria-hidden="true"
            >
                <div class="modal-dialog modal-lg modal-dialog-scrollable">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="privacyModalLabel">
                                Datenschutzerkl&auml;rung
                            </h5>
                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="modal"
                                aria-label="Schlie&szlig;en"
                            ></button>
                        </div>
                        <div class="modal-body">
                            <div class="text-center py-4">
                                <div
                                    class="spinner-border text-dark"
                                    role="status"
                                >
                                    <span class="visually-hidden"
                                        >Laden...</span
                                    >
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <script>
                document.addEventListener("DOMContentLoaded", function () {
                    var modal = document.getElementById("privacyModal");
                    if (!modal) return;
                    var body = modal.querySelector(".modal-body");
                    var loaded = false;

                    modal.addEventListener("show.bs.modal", function (event) {
                        if (loaded) return;
                        var trigger = event.relatedTarget;
                        var url = trigger
                            ? trigger.getAttribute("data-privacy-url")
                            : "";
                        if (!url) {
                            body.innerHTML =
                                "<p>Die Datenschutzerkl\u00e4rung wurde noch nicht konfiguriert.</p>";
                            return;
                        }
                        fetch(url)
                            .then(function (r) {
                                return r.text();
                            })
                            .then(function (html) {
                                var parser = new DOMParser();
                                var doc = parser.parseFromString(
                                    html,
                                    "text/html",
                                );
                                var main = doc.querySelector("main");
                                body.innerHTML = main
                                    ? main.innerHTML
                                    : doc.body.innerHTML;
                                loaded = true;
                            })
                            .catch(function () {
                                body.innerHTML =
                                    "<p>Die Datenschutzerkl\u00e4rung konnte nicht geladen werden.</p>";
                            });
                    });

                    document
                        .querySelectorAll(".cb-privacy-link")
                        .forEach(function (link) {
                            link.addEventListener("click", function (e) {
                                e.stopPropagation();
                            });
                        });
                });
            </script>
        </div>
    </formvh:renderRenderable>
</html>
