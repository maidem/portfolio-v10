<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:formvh="http://typo3.org/ns/TYPO3/CMS/Form/ViewHelpers"
    xmlns:vite="http://typo3.org/ns/Praetorius/ViteAssetCollector/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <formvh:renderRenderable renderable="{form}">
        <vite:asset
            entry="EXT:my_sitepackage/Resources/Private/Frontend/Form.entry.scss"
        />
        <div class="cb-form-wrap">
            <div class="cb-form js-measure cb-form__measure" data-measure-v="box" data-measure-from=".form-element" data-measure-until=".form-element-check input[type=checkbox]" data-measure-hbelow=".form-element-check">
                            <formvh:form
                                object="{form}"
                                action="{form.renderingOptions.controllerAction}"
                                method="{form.renderingOptions.httpMethod}"
                                id="{form.identifier}"
                                section="{form.identifier}"
                                enctype="{form.renderingOptions.httpEnctype}"
                                addQueryString="{form.renderingOptions.addQueryString}"
                                argumentsToBeExcludedFromQueryString="{form.renderingOptions.argumentsToBeExcludedFromQueryString}"
                                additionalParams="{form.renderingOptions.additionalParams}"
                                additionalAttributes="{formvh:translateElementProperty(element: form, property: 'fluidAdditionalAttributes')}"
                                novalidate="novalidate"
                            >
                                <f:render
                                    partial="{form.currentPage.templateName}"
                                    arguments="{page: form.currentPage}"
                                />
                                <div
                                    class="{form.renderingOptions.formNavigation.navigationWrapperClassAttribute}"
                                >
                                    <f:render
                                        partial="Form/Navigation"
                                        arguments="{form: form}"
                                    />
                                </div>
                            </formvh:form>
            </div>

            <dialog
                id="privacyModal"
                class="cb-dialog"
                aria-labelledby="privacyModalLabel"
            >
                <div class="cb-dialog__content">
                    <div class="cb-dialog__header">
                        <h5 class="cb-dialog__title" id="privacyModalLabel">
                            Datenschutzerkl&auml;rung
                        </h5>
                        <button
                            type="button"
                            class="cb-dialog__close"
                            aria-label="Schlie&szlig;en"
                        >&times;</button>
                    </div>
                    <div class="cb-dialog__body">
                        <div class="cb-dialog__spinner">
                            <span class="cb-visually-hidden">Laden...</span>
                        </div>
                    </div>
                </div>
            </dialog>

            <script>
                // Erfolgs-Toast nach Redirect vom Formular-Submit.
                // Läuft direkt beim Parsen (Formular steht im DOM darüber), damit
                // der Sprung zum Formular vor dem ersten Paint passiert — ohne
                // sichtbare Smooth-Scroll-Fahrt von oben.
                (function () {
                    var params = new URLSearchParams(location.search);
                    if (params.get("contact") === "sent") {
                        document.getElementById("contact-13")?.scrollIntoView({ behavior: "instant", block: "start" });
                        var toast = document.createElement("div");
                        toast.className = "cb-toast";
                        toast.setAttribute("role", "status");
                        toast.innerHTML =
                            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>' +
                            "Danke für deine Nachricht! Ich melde mich so schnell wie möglich bei dir.";
                        document.body.appendChild(toast);
                        setTimeout(function () {
                            toast.classList.add("cb-toast--hide");
                            setTimeout(function () { toast.remove(); }, 400);
                        }, 5000);
                        params.delete("contact");
                        var clean = location.pathname + (params.toString() ? "?" + params : "") + location.hash;
                        history.replaceState(null, "", clean);
                    }

                    var dialog = document.getElementById("privacyModal");
                    if (!dialog) return;
                    var body = dialog.querySelector(".cb-dialog__body");
                    var loaded = false;

                    function loadContent() {
                        var url = document.querySelector('.cb-privacy-link')?.getAttribute('data-privacy-url')
                            || document.querySelector('a[href*="datenschutz"]')?.getAttribute('href')
                            || "";
                        if (!url) {
                            body.innerHTML = "<p>Die Datenschutzerklärung wurde noch nicht konfiguriert.</p>";
                            return;
                        }
                        fetch(url)
                            .then(function (r) { return r.text(); })
                            .then(function (html) {
                                var parser = new DOMParser();
                                var doc = parser.parseFromString(html, "text/html");
                                var main = doc.querySelector("main");
                                var root = main || doc.body;
                                root.querySelectorAll(
                                    ".cb-portfolio-banner, .cb-bg-fill, .cb-perspective-grid"
                                ).forEach(function (el) { el.remove(); });
                                body.innerHTML = root.innerHTML;
                                loaded = true;
                            })
                            .catch(function () {
                                body.innerHTML = "<p>Die Datenschutzerklärung konnte nicht geladen werden.</p>";
                            });
                    }

                    dialog.querySelector(".cb-dialog__close").addEventListener("click", function () {
                        dialog.close();
                    });

                    dialog.addEventListener("click", function (e) {
                        if (e.target === dialog) dialog.close();
                    });

                    document.querySelectorAll(".cb-privacy-link").forEach(function (link) {
                        link.addEventListener("click", function (e) {
                            e.preventDefault();
                            e.stopPropagation();
                            if (!loaded) loadContent();
                            dialog.showModal();
                        });
                    });
                })();
            </script>
        </div>
    </formvh:renderRenderable>
</html>
