<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<body style="margin:0;padding:0;background:#f7f7f5;font-family:Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f7f5;padding:32px 16px;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;">
                <tr>
                    <td style="background:#111111;padding:28px 32px;border-bottom:4px solid #ED1C24;">
                        <h1 style="margin:0;color:#ffffff;font-size:20px;font-weight:600;">{form.label}</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:24px 32px;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                            <f:for each="{form.elements}" as="element">
                                <f:if condition="{element.type} != 'Honeypot'">
                                    <tr>
                                        <td style="padding:10px 0;border-bottom:1px solid #eeeeee;color:#888888;font-size:12px;text-transform:uppercase;letter-spacing:.06em;width:35%;vertical-align:top;">
                                            <f:translate key="{element.uniqueIdentifier}.label" extensionName="{form.renderingOptions.translation.extensionName}" default="{element.label}"/>
                                        </td>
                                        <td style="padding:10px 0;border-bottom:1px solid #eeeeee;color:#111111;font-size:15px;line-height:1.5;">
                                            <formvh:renderFormValue renderable="{element}" as="formValue" xmlns:formvh="http://typo3.org/ns/TYPO3/CMS/Form/ViewHelpers">
                                                <f:if condition="{formValue.processedValue}">
                                                    <f:then>
                                                        <f:for each="{formValue.processedValue}" as="value">{value}<br/></f:for>
                                                    </f:then>
                                                    <f:else>&mdash;</f:else>
                                                </f:if>
                                            </formvh:renderFormValue>
                                        </td>
                                    </tr>
                                </f:if>
                            </f:for>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="background:#111111;padding:18px 32px;color:#888888;font-size:12px;">
                        Gesendet über das Kontaktformular auf <a href="https://maidem.de" style="color:#ED1C24;text-decoration:none;">maidem.de</a>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
