<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:formvh="http://typo3.org/ns/TYPO3/CMS/Form/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <div id="{form.identifier}" class="cb-form-confirmation">
        <div class="cb-form-success-icon" aria-hidden="true">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M20 6 9 17l-5-5" />
            </svg>
        </div>
        <p>Hallo {form.name},</p>
        <p>Vielen Dank für deine Nachricht. Ich werde mich schnellstmöglich bei dir melden.</p>
        <p>
            Gruß<br />
            {contactName}<br />
            {contactPhone}<br />
            {contactEmail}
        </p>
    </div>
</html>
