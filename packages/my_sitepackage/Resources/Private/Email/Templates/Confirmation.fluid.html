<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:formvh="http://typo3.org/ns/TYPO3/CMS/Form/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <div id="{form.identifier}" class="cb-form-confirmation">
        <p>Hallo {form.name},</p>
        <p>vielen Dank für deine Nachricht über mein Portfolio. Ich melde mich zeitnah zurück.</p>
        <p>
            Beste Grüße<br />
            {contactName}<br />
            {contactStreet}<br />
            {contactCity}
        </p>
        <p>
            E-Mail: {contactEmail}<br />
            Telefon: {contactPhone}
        </p>
    </div>
</html>
