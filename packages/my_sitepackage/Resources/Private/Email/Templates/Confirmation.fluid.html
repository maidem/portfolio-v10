<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:formvh="http://typo3.org/ns/TYPO3/CMS/Form/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <div id="{form.identifier}" class="cb-form-confirmation">
        <p>Hallo {form.name},</p>
        <p>vielen Dank für deine Nachricht über mein Portfolio. Ich habe deine Anfrage erhalten und melde mich zeitnah persönlich bei dir zurück.</p>
        <p>Für Rückfragen erreichst du mich auch direkt unter den unten stehenden Kontaktdaten.</p>
        <p>
            Beste Grüße<br />
            {contactName}<br />
            {contactPhone}<br />
            {contactEmail}
        </p>
    </div>
</html>
