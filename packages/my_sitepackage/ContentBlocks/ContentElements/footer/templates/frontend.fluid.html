<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <f:asset.css
        identifier="cb-footer-css"
        href="{cb:assetPath()}/frontend.css"
    />

    <footer class="cb-footer py-5" id="c{data.uid}">
        <div class="container">
            <div
                class="d-flex justify-content-center align-items-center text-center"
            >
                <div class="cb-footer__right">
                    <nav class="cb-footer__nav" aria-label="Footer Navigation">
                        <f:if condition="{data.footer_links}">
                            <f:for each="{data.footer_links}" as="item">
                                <f:link.typolink
                                    parameter="{item.link_url}"
                                    class="cb-footer__link"
                                >
                                    {item.link_label}
                                </f:link.typolink>
                            </f:for>
                        </f:if>
                        <f:if condition="{data.gripsraum_footer_github_link}">
                            <f:link.typolink
                                parameter="{data.gripsraum_footer_github_link}"
                                class="cb-footer__link cb-footer__link--external"
                                target="_blank"
                                additionalAttributes="{rel: 'noopener noreferrer', title: 'GitHub'}"
                                >GitHub</f:link.typolink
                            >
                        </f:if>
                    </nav>
                </div>
            </div>
            <a href="#top" class="cb-footer__totop" aria-label="Nach oben">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path d="m5 15 7-7 7 7" />
                </svg>
            </a>
            <p class="cb-footer__made text-center">
                Made with TYPO3
                <svg
                    class="cb-footer__heart"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    aria-hidden="true"
                >
                    <path
                        d="M12 20.3C6.5 16.4 3 13 3 9.1 3 6.3 5.2 4 8 4c1.6 0 3.1.8 4 2.1C12.9 4.8 14.4 4 16 4c2.8 0 5 2.3 5 5.1 0 3.9-3.5 7.3-9 11.2z"
                    />
                </svg>
            </p>
        </div>
    </footer>
</html>
