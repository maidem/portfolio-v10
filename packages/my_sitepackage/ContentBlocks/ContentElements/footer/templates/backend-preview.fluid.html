<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Preview"/>

<f:section name="Header">
    <cb:link.editRecord uid="{data.uid}" table="{data.mainType}">
        <strong>Footer:</strong> {data.header}
    </cb:link.editRecord>
</f:section>

<f:section name="Content">
    <div style="padding: 8px 0;">
        <f:if condition="{data.gripsraum_footer_github_link}">
            <small style="color: #6c757d;">GitHub: ✔</small>
        </f:if>
        <f:if condition="{data.gripsraum_footer_footer_links}">
            <small style="color: #6c757d;"> | Links: {data.gripsraum_footer_footer_links -> f:count()} Stück</small>
        </f:if>
    </div>
</f:section>

</html>
