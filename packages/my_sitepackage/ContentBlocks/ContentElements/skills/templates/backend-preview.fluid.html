<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Preview"/>

<f:section name="Header">
    <cb:link.editRecord uid="{data.uid}" table="{data.mainType}">{data.header}</cb:link.editRecord>
</f:section>

<f:section name="Content">
    <style>
        .skills-preview-badge {
            display: inline-block;
            margin-right: 4px;
            margin-bottom: 4px;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            background: color-mix(in srgb, currentColor 12%, transparent);
        }
    </style>
    <f:if condition="{data.skill_categories}">
        <f:then>
            <f:for each="{data.skill_categories}" as="category">
                <div style="margin-bottom: 6px">
                    <strong>{category.category_name}</strong>
                    <f:for each="{category.skills}" as="skill">
                        <span class="skills-preview-badge">{skill.skill_name}</span>
                    </f:for>
                </div>
            </f:for>
        </f:then>
        <f:else>
            <em>Keine Kategorien angelegt</em>
        </f:else>
    </f:if>
</f:section>
</html>
