<section
    id="{f:if(condition: data.section_anchor, then: data.section_anchor, else: 'c{data.uid}')}"
>
    <div class="container cb-skills-wrapper">
        <f:if condition="{data.skill_items}">
            <div class="cb-card cb-skills-unified-card">
                <f:if condition="{data.header}">
                    <div class="cb-card__label-bar">{data.header}</div>
                </f:if>
                <div class="cb-card__body">
                    <div class="row">
                        <div class="col-12 col-md-9 mx-auto">
                            <!-- Filter-Bar: wird via JS aus data-category-Attributen aufgebaut -->
                            <div
                                class="cb-skills-filter-bar"
                                role="group"
                                aria-label="Filter nach Kategorie"
                            ></div>
                            <div class="cb-skill-tiles-grid" data-skills-filter>
                                <f:for each="{data.skill_items}" as="skill">
                                    <f:if condition="{skill.skill_name}">
                                        <div
                                            class="cb-skill-tile"
                                            data-category="{skill.filter_group}"
                                        >
                                            {skill.skill_name}
                                        </div>
                                    </f:if>
                                </f:for>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </f:if>

        <f:if condition="{data.gripsraum_skills_show_pdf_export_button}">
            <div class="cb-skills__pdf-action">
                <button
                    class="cb-pdf-add-btn"
                    type="button"
                    data-pdf-section="tech"
                    aria-pressed="false"
                >
                    <span class="cb-pdf-add-btn__label"
                        >Zu PDF-Export hinzufügen</span
                    >
                </button>
            </div>
        </f:if>
    </div>
</section>
