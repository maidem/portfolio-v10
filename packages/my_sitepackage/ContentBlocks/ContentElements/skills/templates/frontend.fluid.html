<section
    id="{f:if(condition: data.section_anchor, then: data.section_anchor, else: 'c{data.uid}')}"
>
    <div class="cb-section-skills__container">
        <f:if condition="{data.skill_categories}">
            <div class="cb-card cb-skills-unified-card">
                <f:if condition="{data.header}">
                    <h2 class="cb-card__label-bar">{data.header}</h2>
                </f:if>
                <div class="cb-card__body">
                    <div class="cb-skills-groups">
                        <f:for each="{data.skill_categories}" as="category">
                            <section class="cb-skills-group">
                                <h3 class="cb-skills-group__title">{category.category_name}</h3>
                                <ul class="cb-skills-chips">
                                    <f:for each="{category.skills}" as="skill">
                                        <li>
                                            <button type="button" class="cb-skill-chip">{skill.skill_name}</button>
                                        </li>
                                    </f:for>
                                </ul>
                            </section>
                        </f:for>
                    </div>
                </div>
            </div>
        </f:if>

        <f:if condition="{data.gripsraum_skills_show_pdf_export_button}">
            <div class="cb-skills__pdf-action">
                <button
                    class="cb-pdf-add-btn"
                    type="button"
                    data-pdf-section="tech"
                    data-pdf-label="Skills &amp; Tech-Stack"
                    aria-pressed="false"
                >
                    <span class="cb-pdf-add-btn__label"
                        >Zum PDF-Dossier hinzufügen</span
                    >
                </button>
            </div>
        </f:if>
    </div>
</section>
