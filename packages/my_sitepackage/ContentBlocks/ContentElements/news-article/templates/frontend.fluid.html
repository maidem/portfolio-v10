<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <div
        class="container cb-news-article"
        id="{f:if(condition: data.section_anchor, then: data.section_anchor, else: 'c{data.uid}')}"
    >
        <div class="cb-card cb-card--article">
            <!-- Header Block - Now without the border-bottom line -->
            <div class="row mb-5 pb-5">
                <div class="col-12">
                    <a
                        href="javascript:void(0)"
                        onclick="
                            if (
                                window.history.length > 1 &&
                                document.referrer.indexOf(
                                    window.location.host,
                                ) !== -1
                            ) {
                                history.back();
                            } else {
                                window.location.href = '/';
                            }
                        "
                        class="cb-news-article-back mb-4 d-inline-block"
                    >
                        ← Zurück
                    </a>

                    <f:if condition="{data.header}">
                        <h1 class="cb-news-article-title-top mb-3">
                            {data.header}
                        </h1>
                    </f:if>

                    <f:if condition="{data.gripsraum_newsarticle_teaser_text}">
                        <p class="cb-news-article-teaser mb-4">
                            {data.gripsraum_newsarticle_teaser_text}
                        </p>
                    </f:if>

                    <f:if condition="{data.gripsraum_newsarticle_project_date}">
                        <span class="cb-news-article-date mb-0 d-block">
                            <f:format.date
                                format="d. M Y"
                                date="{data.gripsraum_newsarticle_project_date}"
                            />
                        </span>
                    </f:if>
                </div>
            </div>

            <div class="row g-5">
                <!-- Navigation Sidebar (Sticky) — hidden on mobile, select dropdown is used instead -->
                <div class="col-md-3 d-none d-md-block">
                    <div
                        class="cb-sidebar sticky-top"
                        style="top: 8rem; z-index: 10"
                    >
                        <div
                            class="cb-toc-minimal"
                            id="cb-news-article-toc-container"
                        ></div>
                    </div>
                </div>

                <!-- Content Area -->
                <div class="col-md-9">
                    <div class="cb-news-article-body">
                        <f:format.html>{data.bodytext}</f:format.html>
                    </div>
                </div>
            </div>
        </div>
    </div>
</html>
