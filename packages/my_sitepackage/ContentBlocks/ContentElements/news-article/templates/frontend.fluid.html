<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <div class="container cb-news-article" id="c{data.uid}">
        <div class="row">
            <div class="col-12 mb-4">
                <f:if condition="{data.header}">
                    <h1 class="cb-news-article-title">{data.header}</h1>
                </f:if>
                <f:if condition="{data.gripsraum_newsarticle_project_date}">
                    <span
                        class="cb-news-article-date text-muted text-uppercase font-monospace mt-2 d-inline-block"
                    >
                        <f:format.date
                            format="d. M Y"
                            date="{data.gripsraum_newsarticle_project_date}"
                        />
                    </span>
                </f:if>
            </div>
        </div>

        <div class="row position-relative">
            <div class="col-md-3">
                <div
                    class="cb-sidebar sticky-top"
                    style="top: 5.5rem; z-index: 1020"
                >
                    <a
                        href="javascript:void(0)"
                        onclick="
                            if (
                                window.history.length > 1 &&
                                document.referrer.indexOf(
                                    window.location.host,
                                ) !== -1
                            ) {
                                history.back();
                            } else {
                                window.location.href = '/';
                            }
                        "
                        class="cb-news-article-back text-uppercase font-monospace text-muted d-inline-block mb-3"
                    >
                        ← Zurück
                    </a>

                    <!-- TOC Container (populated by frontend.js) -->
                    <div
                        class="cb-sidebar-card"
                        id="cb-news-article-toc-container"
                    ></div>
                </div>
            </div>
            <div class="col-md-9">
                <div class="cb-news-article-body">
                    <f:format.html>{data.bodytext}</f:format.html>
                </div>
            </div>
        </div>
    </div>
</html>
