<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <div
        class="container cb-news-article"
        id="{f:if(condition: data.section_anchor, then: data.section_anchor, else: 'c{data.uid}')}"
        data-article-uid="{data.uid}"
    >
        <div class="cb-news-article-inner">
            <!-- Header Block -->
            <div class="row mb-4 pb-4">
                <div class="col-12">
                    <a
                        href="javascript:void(0)"
                        onclick="
                            if (
                                window.history.length > 1 &&
                                document.referrer.indexOf(
                                    window.location.host,
                                ) !== -1
                            ) {
                                history.back();
                            } else {
                                window.location.href = '/';
                            }
                        "
                        class="cb-news-article-back mb-3 d-inline-block"
                    >
                        ← Zurück
                    </a>

                    <f:if condition="{data.gripsraum_newsarticle_project_date}">
                        <span class="cb-news-article-date d-block mb-3">
                            <f:format.date
                                format="d. M Y"
                                date="{data.gripsraum_newsarticle_project_date}"
                            />
                        </span>
                    </f:if>

                    <f:if condition="{data.header}">
                        <h1 class="cb-news-article-title-top mb-3">
                            {data.header}
                        </h1>
                    </f:if>

                    <f:if condition="{data.gripsraum_newsarticle_teaser_text}">
                        <p class="cb-news-article-teaser mb-0">
                            {data.gripsraum_newsarticle_teaser_text}
                        </p>
                    </f:if>

                    <f:if
                        condition="{data.gripsraum_newsarticle_show_pdf_export_button}"
                    >
                        <div class="mt-3">
                            <button
                                class="cb-pdf-add-btn"
                                type="button"
                                data-pdf-section="logbook_{data.uid}"
                                aria-pressed="false"
                            >
                                <span class="cb-pdf-add-btn__label"
                                    >Zu PDF-Export hinzufügen</span
                                >
                            </button>
                        </div>
                    </f:if>
                </div>
            </div>

            <div class="row g-5">
                <!-- Navigation Sidebar (Sticky) — hidden on mobile, collapsible panel is used instead -->
                <div class="col-md-4 d-none d-md-block">
                    <div class="cb-sidebar">
                        <div
                            class="cb-toc-minimal"
                            id="cb-news-article-toc-{data.uid}"
                        ></div>
                    </div>
                </div>

                <!-- Content Area -->
                <div class="col-md-8">
                    <div class="cb-news-article-body">
                        <f:format.html>{data.bodytext}</f:format.html>
                    </div>
                </div>
            </div>

            <!-- Prev / Next Article Navigation -->
            <f:if condition="{prevArticle} || {nextArticle}">
                <nav class="cb-article-nav" aria-label="Weitere Artikel">
                    <div class="cb-article-nav__inner">
                        <!-- Previous = older article -->
                        <div class="cb-article-nav__item cb-article-nav__item--prev">
                            <f:if condition="{prevArticle}">
                                <f:link.page
                                    pageUid="{prevArticle.pid}"
                                    section="c{prevArticle.uid}"
                                    class="cb-article-nav__link"
                                >
                                    <span class="cb-article-nav__label">← Vorheriger Artikel</span>
                                    <span class="cb-article-nav__title">{prevArticle.header}</span>
                                </f:link.page>
                            </f:if>
                        </div>
                        <!-- Next = newer article -->
                        <div class="cb-article-nav__item cb-article-nav__item--next">
                            <f:if condition="{nextArticle}">
                                <f:link.page
                                    pageUid="{nextArticle.pid}"
                                    section="c{nextArticle.uid}"
                                    class="cb-article-nav__link"
                                >
                                    <span class="cb-article-nav__label">Nächster Artikel →</span>
                                    <span class="cb-article-nav__title">{nextArticle.header}</span>
                                </f:link.page>
                            </f:if>
                        </div>
                    </div>
                </nav>
            </f:if>
        </div>
    </div>
</html>
