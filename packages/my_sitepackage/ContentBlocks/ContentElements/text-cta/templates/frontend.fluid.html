<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <section
        id="{f:if(condition: data.section_anchor, then: data.section_anchor, else: 'c{data.uid}')}"
        class="cb-text-cta container"
    >
        <f:if condition="{data.header}">
            <h2 class="cb-text-cta__heading">{data.header}</h2>
        </f:if>
        <f:if condition="{data.bodytext}">
            <div class="cb-text-cta__text">
                <f:format.html>{data.bodytext}</f:format.html>
            </div>
        </f:if>
        <f:if condition="{data.cta_1_label} || {data.gripsraum_textcta_show_pdf_export_button}">
            <div class="cb-text-cta__actions">
                <f:if condition="{data.cta_1_label} && {data.cta_1_link}">
                    <f:link.typolink
                        parameter="{data.cta_1_link}"
                        class="cb-text-cta__cta-btn"
                        >{data.cta_1_label}</f:link.typolink
                    >
                </f:if>
                <f:if condition="{data.cta_2_label} && {data.cta_2_link}">
                    <f:link.typolink
                        parameter="{data.cta_2_link}"
                        class="cb-text-cta__cta-btn cb-text-cta__cta-btn--outline"
                        >{data.cta_2_label}</f:link.typolink
                    >
                </f:if>
                <f:if condition="{data.gripsraum_textcta_show_pdf_export_button}">
                    <button
                        class="cb-pdf-add-btn"
                        type="button"
                        data-pdf-section="story"
                        data-pdf-label="{data.header}"
                        aria-pressed="false"
                    >
                        <span class="cb-pdf-add-btn__label"
                            >Zum PDF-Dossier hinzufügen</span
                        >
                    </button>
                </f:if>
            </div>
        </f:if>
    </section>
</html>
