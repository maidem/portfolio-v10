<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <section
        id="{f:if(condition: data.section_anchor, then: data.section_anchor, else: 'c{data.uid}')}"
    >
        <div class="cb-section-projects__container">
            <div class="cb-card">
                <f:if condition="{data.header}">
                    <h2 class="cb-card__label-bar">{data.header}</h2>
                </f:if>
                <div class="cb-card__body">
                    <f:if condition="{projects}">
                        <f:for each="{projects}" as="item">
                            <article class="cb-news-item">
                                <div class="cb-news-item__row">
                                    <div class="cb-news-item__date-col">
                                        <f:if condition="{item.data.gripsraum_newsarticle_project_date}">
                                            <time
                                                class="cb-news-date"
                                                datetime="{f:format.date(format: 'Y-m-d', date: item.data.gripsraum_newsarticle_project_date)}"
                                            >
                                                <f:format.date
                                                    format="d. M Y"
                                                    date="{item.data.gripsraum_newsarticle_project_date}"
                                                />
                                            </time>
                                        </f:if>
                                    </div>
                                    <div class="cb-news-item__content-col">
                                        <h3 class="cb-news-title">
                                            {item.data.header}
                                        </h3>
                                        <f:if condition="{item.data.gripsraum_newsarticle_teaser_text}">
                                            <p class="cb-news-teaser">
                                                {item.data.gripsraum_newsarticle_teaser_text}
                                            </p>
                                        </f:if>
                                        <div class="cb-news-item__actions">
                                            <f:link.page
                                                pageUid="{item.data.pid}"
                                                section="c{item.data.uid}"
                                                class="cb-news-link cb-stretched-link"
                                            >
                                                Weiterlesen …
                                            </f:link.page>
                                        </div>
                                    </div>
                                </div>
                            </article>
                        </f:for>
                    </f:if>
                    <f:if condition="!{projects}">
                        <p class="cb-news-empty">
                            Noch keine Projekte vorhanden.
                        </p>
                    </f:if>
                </div>
            </div>
        </div>
    </section>
</html>
