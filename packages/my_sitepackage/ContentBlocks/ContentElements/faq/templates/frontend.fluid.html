<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <section id="{f:if(condition: data.section_anchor, then: data.section_anchor, else: 'c{data.uid}')}">
        <div class="container cb-faq">
            <div class="cb-card">
                <f:if condition="{data.header}">
                    <div class="cb-card__left">
                        <h2 class="cb-card__title cb-faq__info-title">{data.header}</h2>
                    </div>
                </f:if>

                <div class="cb-card__right">
                    <f:if condition="{data.about_image}">
                        <div class="cb-faq__about-image mb-4">
                            <f:image
                                image="{data.about_image.0}"
                                class="img-fluid w-100 h-auto rounded-4"
                                alt="{data.header}"
                                width="600"
                                height="800c"
                            />
                        </div>
                    </f:if>
                    
                    <f:if condition="{data.bodytext}">
                        <div class="cb-faq__about-text lead fs-6 mb-5 pb-xl-5"> <!-- Removed opacity-75 -->
                            <f:format.html>{data.bodytext}</f:format.html>
                        </div>
                    </f:if>
                </div>

                <f:if condition="{data.faq_header}">
                    <!-- Optional top-border mapping on desktop conceptually, or just simple margin -->
                    <div class="cb-card__left cb-faq__sub-left pt-md-4">
                        <h2 class="cb-card__title">{data.faq_header}</h2>
                    </div>
                </f:if>

                <div class="cb-card__right cb-faq__sub-right pt-md-4">
                    <div class="cb-faq__list" role="list">
                        <f:if condition="{data.faq_items}">
                            <f:for
                                each="{data.faq_items}"
                                as="item"
                                iteration="iter"
                            >
                                <div class="cb-faq__item" role="listitem">
                                    <button
                                        class="cb-faq__trigger"
                                        aria-expanded="false"
                                        type="button"
                                    >
                                        <span class="cb-faq__icon"></span>
                                        <span class="cb-faq__question"
                                            >{item.question}</span
                                        >
                                    </button>
                                    <div class="cb-faq__content" role="region">
                                        <div class="cb-faq__content-inner">
                                            <div class="cb-faq__answer">
                                                <f:format.html
                                                    >{item.answer}</f:format.html
                                                >
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </f:for>
                        </f:if>
                    </div>
                </div>
            </div>
        </div>
    </section>
</html>
