<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<div class="container cb-faq" id="c{data.uid}">
        <f:if condition="{data.header}">
            <div class="cb-faq__header">
                <h2 class="cb-section-heading">{data.header}</h2>
            </div>
        </f:if>

        <div class="cb-faq__list" role="list">
            <f:if condition="{data.faq_items}">
                <f:for each="{data.faq_items}" as="item">
                    <div class="cb-faq__item" role="listitem">
                        <button class="cb-faq__trigger" aria-expanded="false" type="button">
                            <span class="cb-faq__question">{item.question}</span>
                            <span class="cb-faq__icon">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </span>
                        </button>
                        <div class="cb-faq__content" role="region">
                            <div class="cb-faq__content-inner">
                                <f:format.html>{item.answer}</f:format.html>
                            </div>
                        </div>
                    </div>
                </f:for>
            </f:if>
        </div>
    </div>
</html>
