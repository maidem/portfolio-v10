name: gripsraum/hero
typeName: gripsraum_hero
group: default
description: description
prefixFields: true
prefixType: full
basics:
  - TYPO3/Appearance
  - TYPO3/Links
fields:
  - identifier: header
    useExistingField: true
  - identifier: subheader
    useExistingField: true
  - identifier: display_mode
    type: Select
    renderType: selectSingle
    default: full
    items:
      - label: Full Width
        value: full
      - label: Split 50/50
        value: split
  - identifier: background_image
    type: File
    maxitems: 1
    allowed: common-image-types
  - identifier: split_left_image
    type: File
    maxitems: 1
    allowed: common-image-types
