<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <section
        id="{f:if(condition: data.section_anchor, then: data.section_anchor, else: 'c{data.uid}')}"
        class="cb-hero-section"
    >
        <div class="container">
            <div class="cb-hero position-relative">
                <!-- Card with black border -->
                <div class="cb-hero__card">
                    <!-- Heading + Decoration inline -->
                    <f:if condition="{data.header}">
                        <div class="cb-hero__heading-wrapper">
                            <h1 class="cb-hero__heading">{data.header}</h1>
                        </div>
                    </f:if>

                    <!-- Content body: two columns -->
                    <div class="cb-hero__body">
                        <div class="row gx-md-5 align-items-start">
                            <f:if condition="{data.show_left}">
                                <f:if condition="{data.bodytext}">
                                    <div class="col-12 col-md-6 cb-hero__left">
                                        <div class="cb-hero__text">
                                            <f:format.html
                                                >{data.bodytext}</f:format.html
                                            >
                                        </div>
                                    </div>
                                </f:if>
                            </f:if>

                            <f:if condition="{data.show_right}">
                                <f:if condition="{data.right_text}">
                                    <div class="col-12 col-md-6 cb-hero__right">
                                        <div class="cb-hero__text">
                                            <f:format.html
                                                >{data.right_text}</f:format.html
                                            >
                                        </div>
                                    </div>
                                </f:if>
                            </f:if>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</html>
