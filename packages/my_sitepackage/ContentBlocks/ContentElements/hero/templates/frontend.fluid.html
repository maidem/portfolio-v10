<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <!-- Use the styles from the new consolidated hero/assets/frontend.scss -->
    <f:asset.css
        identifier="cb-hero-css"
        href="{cb:assetPath()}/frontend.css"
    />

    <section
        id="{f:if(condition: data.section_anchor, then: data.section_anchor, else: 'c{data.uid}')}"
    >
        <div class="container cb-hero">
            <div class="cb-card position-relative overflow-hidden">
                <!-- Column 1: Header / Label -->
                <f:if condition="{data.header}">
                    <div class="cb-card__left">
                        <h2 class="cb-card__title">{data.header}</h2>
                    </div>
                </f:if>

                <!-- Column 2: Information / Profiles -->
                <div class="cb-card__right">
                    <f:if condition="{data.about_image}">
                        <div class="cb-hero__about-image mb-4">
                            <f:image
                                image="{data.about_image.0}"
                                class="img-fluid w-100 h-auto rounded-4"
                                alt="{data.header}"
                                width="600"
                                height="800c"
                            />
                        </div>
                    </f:if>

                    <f:if condition="{data.bodytext}">
                        <div class="cb-hero__about-text lead fs-6 mb-4">
                            <f:format.html>{data.bodytext}</f:format.html>
                        </div>
                    </f:if>
                </div>

                <!-- FAQ Section -->
                <div class="cb-card__left cb-hero__faq-left pt-md-2">
                    <!-- Left column empty as requested -->
                </div>

                <div class="cb-card__right cb-hero__faq-right pt-md-2">
                    <f:if condition="{data.faq_header}">
                        <h3 class="cb-faq__title-inline mb-4">
                            {data.faq_header}
                        </h3>
                    </f:if>

                    <div class="cb-faq__list" role="list">
                        <f:if condition="{data.faq_items}">
                            <f:for
                                each="{data.faq_items}"
                                as="faqItem"
                                iteration="iteration"
                            >
                                <div class="cb-faq__item" role="listitem">
                                    <button
                                        class="cb-faq__trigger"
                                        aria-expanded="false"
                                        type="button"
                                    >
                                        <span class="cb-faq__icon"></span>
                                        <span class="cb-faq__question"
                                            >{faqItem.question}</span
                                        >
                                    </button>
                                    <div class="cb-faq__content" role="region">
                                        <div class="cb-faq__content-inner">
                                            <div class="cb-faq__answer">
                                                <f:format.html
                                                    >{faqItem.answer}</f:format.html
                                                >
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </f:for>
                        </f:if>
                    </div>
                </div>
            </div>
        </div>
    </section>
</html>
