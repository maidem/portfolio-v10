<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <section
        id="{f:if(condition: data.section_anchor, then: data.section_anchor, else: 'c{data.uid}')}"
        class="cb-hero-section"
    >
        <div class="cb-section-hero__container">
            <div class="cb-hero">
                <div class="cb-hero__card">
                    <div class="cb-hero__body">
                        <div class="cb-hero__content">
                            <div class="js-measure cb-hero__measure" data-measure-h="edges">
                                <f:if condition="{data.header}">
                                    <h1 class="cb-hero__heading">
                                        <f:format.raw>{data.header -> f:format.htmlspecialchars() -> f:replace(search: '|', replace: '<br>')}</f:format.raw>
                                    </h1>
                                </f:if>
                                <f:if condition="{data.bodytext}">
                                    <div class="cb-hero__text">
                                        <f:format.html>{data.bodytext}</f:format.html>
                                    </div>
                                </f:if>
                            </div>
                            <f:if condition="{data.cta_1_label} || {data.gripsraum_hero_show_pdf_export_button}">
                                <div class="cb-hero__actions">
                                    <f:if condition="{data.cta_1_label}">
                                        <f:if condition="{data.cta_1_link}">
                                            <f:link.typolink
                                                parameter="{data.cta_1_link}"
                                                class="cb-hero__cta-btn"
                                                >{data.cta_1_label}</f:link.typolink
                                            >
                                        </f:if>
                                        <f:if condition="{data.cta_2_label} && {data.cta_2_link}">
                                            <f:link.typolink
                                                parameter="{data.cta_2_link}"
                                                class="cb-hero__cta-btn cb-hero__cta-btn--ghost"
                                                >{data.cta_2_label}</f:link.typolink
                                            >
                                        </f:if>
                                    </f:if>
                                    <f:if condition="{data.gripsraum_hero_show_pdf_export_button}">
                                        <button
                                            class="cb-pdf-add-btn"
                                            type="button"
                                            data-pdf-section="info"
                                            data-pdf-label="Profil &amp; Vitals"
                                            aria-pressed="false"
                                        >
                                            <span class="cb-pdf-add-btn__label"
                                                >Zum PDF-Dossier hinzufügen</span
                                            >
                                        </button>
                                    </f:if>
                                </div>
                            </f:if>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</html>
