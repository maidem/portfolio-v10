<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <f:asset.css
        identifier="cb-hero-css"
        href="{cb:assetPath()}/frontend.css"
    />

    <f:if condition="{data.display_mode} == 'split'">
        <f:then>
            <section class="cb-hero cb-hero--split" id="hero">
                <div class="row g-0">
                    <div class="col-12 col-md-6 cb-hero-split-left">
                        <f:if condition="{data.split_left_image}">
                            <f:for each="{data.split_left_image}" as="image">
                                <f:image
                                    image="{image}"
                                    width="960"
                                    class="cb-hero-split-img"
                                    alt="{data.header}"
                                />
                            </f:for>
                        </f:if>
                    </div>
                    <div class="col-12 col-md-6 cb-hero-split-right">
                        <div class="cb-hero-split-content">
                            <h1 class="display-3 fw-bold">{data.header}</h1>
                            <f:if condition="{data.subheader}">
                                <p class="lead mb-0">{data.subheader}</p>
                            </f:if>
                        </div>
                    </div>
                </div>
            </section>
        </f:then>
        <f:else>
            <section
                class="cb-hero text-center {f:if(condition: data.background_image, then: 'text-white')}"
                id="hero"
            >
                <f:if condition="{data.background_image}">
                    <div class="cb-hero-bg">
                        <f:for each="{data.background_image}" as="image">
                            <f:image
                                image="{image}"
                                width="1920"
                                class="img-fluid"
                                sizes="(min-width: 1200px) 1920px, (min-width: 768px) 1200px, 100vw"
                                alt="{data.header}"
                            />
                        </f:for>
                    </div>
                    <div class="cb-hero-overlay"></div>
                </f:if>

                <div class="container cb-hero-content">
                    <h1 class="display-3 fw-bold">{data.header}</h1>
                    <f:if condition="{data.subheader}">
                        <p class="lead mb-0">{data.subheader}</p>
                    </f:if>
                </div>
            </section>
        </f:else>
    </f:if>
</html>
