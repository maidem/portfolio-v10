<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <f:layout name="Preview" />

    <f:section name="Header">
        <cb:link.editRecord uid="{data.uid}" table="{data.mainType}"
            ><strong>{data.header}</strong></cb:link.editRecord
        >
    </f:section>

    <f:section name="Content">
        <f:if condition="{data.bodytext}">
            <f:then>
                <span
                    style="
                        display: inline-block;
                        margin-bottom: 6px;
                        padding: 2px 6px;
                        background: #d6ecf0;
                        border-radius: 3px;
                        font-size: 11px;
                    "
                    >Kurzprofil mit Maßpfeilen</span
                >
                <div>
                    <f:format.crop maxCharacters="220"
                        ><f:format.stripTags
                            >{data.bodytext}</f:format.stripTags
                        ></f:format.crop
                    >
                </div>
            </f:then>
            <f:else>
                <span
                    style="
                        display: inline-block;
                        padding: 2px 6px;
                        background: #e9ecef;
                        border-radius: 3px;
                        font-size: 11px;
                    "
                    >Dekorative Wordmark</span
                >
            </f:else>
        </f:if>
    </f:section>
</html>
