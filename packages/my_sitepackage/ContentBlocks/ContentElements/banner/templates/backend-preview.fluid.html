<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <f:layout name="Preview" />

    <f:section name="Header">
        <cb:link.editRecord uid="{data.uid}" table="{data.mainType}"
            ><strong>{data.header}</strong></cb:link.editRecord
        >
    </f:section>

    <f:section name="Content">
        <style>
            .banner-preview-badge {
                display: inline-block;
                margin-bottom: 6px;
                padding: 2px 6px;
                border-radius: 3px;
                font-size: 11px;
                background: color-mix(in srgb, currentColor 12%, transparent);
            }
        </style>
        <f:if condition="{data.bodytext}">
            <f:then>
                <div>
                    <f:format.crop maxCharacters="220"
                        ><f:format.stripTags
                            >{data.bodytext}</f:format.stripTags
                        ></f:format.crop
                    >
                </div>
            </f:then>
            <f:else>
                <span class="banner-preview-badge">Dekorative Wordmark</span>
            </f:else>
        </f:if>
        <f:if condition="{data.cta_1_label}">
            <div style="margin-top: 6px">
                → <f:format.raw>{data.cta_1_label}</f:format.raw>
            </div>
        </f:if>
        <f:if condition="{data.cta_2_label}">
            <div>→ <f:format.raw>{data.cta_2_label}</f:format.raw></div>
        </f:if>
    </f:section>
</html>
