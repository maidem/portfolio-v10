<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <f:if condition="{data.bodytext}">
        <f:then>
            <section
                class="cb-portfolio-banner cb-portfolio-banner--profile"
                id="{f:if(condition: data.section_anchor, then: data.section_anchor, else: 'c{data.uid}')}"
            >
                <div class="cb-portfolio-text cb-portfolio-text--profile">
                    <div class="cb-portfolio-measure">
                        <f:if condition="{data.header}">
                            <h1 class="cb-portfolio-text__heading">{data.header}</h1>
                        </f:if>
                        <f:format.html>{data.bodytext}</f:format.html>
                    </div>
                    <f:if condition="{data.cta_1_label}">
                        <div class="cb-portfolio-banner__actions">
                            <f:if condition="{data.cta_1_link}">
                                <f:link.typolink
                                    parameter="{data.cta_1_link}"
                                    class="cb-portfolio-banner__cta-btn"
                                    >{data.cta_1_label}</f:link.typolink
                                >
                            </f:if>
                            <f:if condition="{data.cta_2_label} && {data.cta_2_link}">
                                <f:link.typolink
                                    parameter="{data.cta_2_link}"
                                    class="cb-portfolio-banner__cta-btn cb-portfolio-banner__cta-btn--outline"
                                    >{data.cta_2_label}</f:link.typolink
                                >
                            </f:if>
                        </div>
                    </f:if>
                    <div class="cb-banner__pdf-action">
                        <button
                            class="cb-pdf-add-btn"
                            type="button"
                            data-pdf-section="story"
                            data-pdf-label="{data.header}"
                            aria-pressed="false"
                        >
                            <span class="cb-pdf-add-btn__label"
                                >Zum PDF-Dossier hinzufügen</span
                            >
                        </button>
                    </div>
                </div>
            </section>
        </f:then>
        <f:else>
            <f:if condition="{data.header}">
                <section class="cb-portfolio-banner" aria-hidden="true">
                    <div class="cb-portfolio-text">{data.header}</div>
                </section>
            </f:if>
        </f:else>
    </f:if>
</html>
