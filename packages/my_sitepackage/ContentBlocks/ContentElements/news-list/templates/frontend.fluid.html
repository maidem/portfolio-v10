<!-- packages/my_sitepackage/ContentBlocks/ContentElements/news-list/templates/frontend.fluid.html -->
<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <section
        id="{f:if(condition: data.section_anchor, then: data.section_anchor, else: 'c{data.uid}')}"
    >
        <div class="container cb-news-list">
            <div class="cb-card">
                <f:if condition="{data.header}">
                    <div class="cb-card__label-bar">{data.header}</div>
                </f:if>
                <div class="cb-card__body">
                    <f:for each="{news}" as="item">
                        <div class="cb-news-item">
                            <div class="row gx-md-4 align-items-baseline">
                                <div class="col-12 col-md-4">
                                    <f:if
                                        condition="{item.data.gripsraum_newsarticle_project_date}"
                                    >
                                        <span
                                            class="cb-news-date text-uppercase font-monospace"
                                        >
                                            <f:format.date
                                                format="d. M Y"
                                                date="{item.data.gripsraum_newsarticle_project_date}"
                                            />
                                        </span>
                                    </f:if>
                                </div>
                                <div class="col-12 col-md-8">
                                    <h3 class="cb-news-title fw-normal mb-1">
                                        {item.data.header}
                                    </h3>
                                    <f:if
                                        condition="{item.data.gripsraum_newsarticle_teaser_text}"
                                    >
                                        <p
                                            class="cb-news-teaser text-muted mb-2"
                                        >
                                            {item.data.gripsraum_newsarticle_teaser_text}
                                        </p>
                                    </f:if>
                                    <div class="d-flex align-items-center gap-3 flex-wrap">
                                        <f:link.page
                                            pageUid="{item.data.pid}"
                                            section="c{item.data.uid}"
                                            class="cb-news-link text-uppercase font-monospace text-dark stretched-link"
                                        >
                                            Weiterlesen →
                                        </f:link.page>
                                        <f:if condition="{item.data.gripsraum_projectarticle_website_url}">
                                            <a
                                                href="{item.data.gripsraum_projectarticle_website_url}"
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                class="cb-news-website-link text-uppercase font-monospace"
                                                style="position:relative;z-index:1"
                                            >
                                                Website →
                                            </a>
                                        </f:if>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </f:for>

                    <f:if condition="!{news}">
                        <p class="text-muted font-monospace small">
                            Keine Artikel vorhanden.
                        </p>
                    </f:if>
                </div>
            </div>
        </div>
    </section>
</html>
