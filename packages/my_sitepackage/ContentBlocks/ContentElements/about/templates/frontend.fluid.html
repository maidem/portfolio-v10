<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <section
        id="{f:if(condition: data.section_anchor, then: data.section_anchor, else: 'c{data.uid}')}"
        class="cb-section-about"
    >
        <div class="container cb-about-wrapper">
            <div class="cb-card">
                <f:if condition="{data.header}">
                    <div class="cb-card__left">
                        <h2 class="cb-card__title">{data.header}</h2>
                    </div>
                </f:if>

                <div class="cb-card__right">
                    <f:if condition="{data.about_image}">
                        <div class="cb-about__image-wrapper mb-4">
                            <f:image
                                image="{data.about_image.0}"
                                class="img-fluid w-100 h-auto rounded-4"
                                alt="{data.header}"
                                width="600"
                                height="800c"
                            />
                        </div>
                    </f:if>
                    <div class="cb-about__content lead fs-6 opacity-75">
                        <f:format.html>{data.bodytext}</f:format.html>
                    </div>
                </div>
            </div>
        </div>
    </section>
</html>
