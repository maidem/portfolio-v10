name: Build and Push Docker Image to GHCR

on:
    push:
        branches:
            - main
        paths:
            - "Dockerfile"
            - "docker-compose.yaml"
            - "composer.json"
            - "composer.lock"
            - "package.json"
            - "package-lock.json"
            - "vite.config.js"
            - "packages/**"
            - ".github/workflows/build-image.yml"
    workflow_dispatch:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set Private Package Permissions
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # Make the package private (if not already)
                  echo "📦 Ensuring package is private..."
                  # Note: Package visibility is typically inherited from repo, but can be adjusted in package settings

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=ref,event=branch
                      type=sha,prefix={{branch}}-
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    notify-coolify:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: Connect to Tailscale Network
              uses: tailscale/github-action@v3
              with:
                  oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
                  tags: tag:ci

            - name: Trigger Coolify Deployment
              run: |
                  curl --silent --show-error --fail-with-body \
                    --request GET \
                    --url "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
                    --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
                    --output /tmp/coolify_response.txt \
                    --write-out "HTTP Status: %{http_code}\n"
                  echo "✅ Coolify deployment triggered"
