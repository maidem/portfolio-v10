name: Build and Deploy with GHCR

on:
  workflow_run:
    workflows: ["Build and Push Docker Image to GHCR"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Coolify via GHCR Image
        run: |
          echo "🚀 Triggering Coolify deploy with GHCR image..."
          curl --silent --show-error --fail-with-body \
            --request GET \
            --url "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            --output /tmp/coolify_response.txt \
            --write-out "HTTP Status: %{http_code}\n"
          echo "Response: $(cat /tmp/coolify_response.txt)"
          echo "✅ Coolify deployment triggered! Using image from ghcr.io/${{ github.repository }}"
