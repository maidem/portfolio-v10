form.contact.recipientEmail: connect@maidem.de
form.contact.privacyPageUid: 15
# Mosparo credentials are loaded as site-set constants from environment
# variables via TYPO3's YamlFileLoader %env()% placeholder syntax. These
# constants feed the {$plugin.tx_mosparoform.settings.projects.default.*}
# placeholders in EXT:mosparo_form/Configuration/TypoScript/setup.typoscript.
# Set in Coolify (Available at Runtime ✓) or .ddev/config.local.yaml:
#   MOSPARO_PUBLIC_SERVER, MOSPARO_VERIFY_SERVER, MOSPARO_UUID,
#   MOSPARO_PUBLIC_KEY, MOSPARO_PRIVATE_KEY
plugin.tx_mosparoform.settings.projects.default.publicServer: '%env(MOSPARO_PUBLIC_SERVER)%'
plugin.tx_mosparoform.settings.projects.default.verifyServer: '%env(MOSPARO_VERIFY_SERVER)%'
plugin.tx_mosparoform.settings.projects.default.uuid: '%env(MOSPARO_UUID)%'
plugin.tx_mosparoform.settings.projects.default.publicKey: '%env(MOSPARO_PUBLIC_KEY)%'
plugin.tx_mosparoform.settings.projects.default.privateKey: '%env(MOSPARO_PRIVATE_KEY)%'
