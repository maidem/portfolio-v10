        - heading "My Story" [level=1] [ref=f2e33]
        - paragraph [ref=f2e34]: Im Jahr 2009 übernahm ich mein erstes Projekt für Terre des Hommes bei einer Kampagne gegen Kindersoldaten in Thailand mit TYPO3 4.3. Schon damals trieb mich die Frage um, wie Probleme für alle Stakeholder einfach und intuitiv gelöst werden können.
        - paragraph [ref=f2e35]: Ich probiere ständig Neues aus, baue Prototypen, mache Bedienkonzepte zum Testen kaputt und beobachte Zielgruppen im Back- und Frontend. Für meine Live Projekte machen dabei häufig TYPO3, Storyblok und Nuxt das Rennen.
        - paragraph [ref=f2e36]: Wenn du jemanden suchst, der digitale Erlebnisse hinterfragt, sie zum Testen auch mal bewusst herausfordert und dein Team mit frischen Perspektiven bereichern kann, dann lass uns herausfinden, ob wir zusammenpassen.
        - generic: 39.00 rem
        - generic: 24.44 rem
