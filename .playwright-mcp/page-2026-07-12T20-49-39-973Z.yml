            - heading "Pdf Dossier" [level=1] [ref=f14e40]
            - paragraph [ref=f14e41]: TYPO3-Extension zur Erzeugung individueller PDF-Zusammenfassungen aus Website-Inhalten. Besucher wählen Abschnitte aus und erhalten ein druckfertiges PDF-Dokument.
            - generic: 66.38 rem
            - generic: 6.03 rem
          - button "+ Zum PDF-Dossier hinzufügen" [ref=f14e43] [cursor=pointer]:
            - text: +
            - generic [ref=f14e44]: Zum PDF-Dossier hinzufügen
        - generic [ref=f14e45]:
          - complementary [ref=f14e46]
          - generic [ref=f14e47]:
            - figure [ref=f14e48]:
              - img "pdf dossier abbildung" [ref=f14e49]
              - generic: 42.81 rem
              - generic: 24.15 rem
            - generic [ref=f14e50]:
              - heading "Überblick" [level=2] [ref=f14e51]
              - paragraph [ref=f14e52]: "Die Extension stellt einen konfigurierbaren PDF-Export bereit, der Inhalte aus verschiedenen Seitenbereichen zusammenführt:"
              - paragraph [ref=f14e53]: Die Auswahl erfolgt über eine Kachel-Oberfläche im Frontend. Vorgemerkte Inhalte werden seitenübergreifend im localStorage gespeichert und beim Aufrufen der Export-Seite automatisch vorausgewählt.
              - heading "Voraussetzungen" [level=2] [ref=f14e54]
              - paragraph [ref=f14e55]: "- TYPO3 14+- PHP 8.4+- Chromium"
              - heading "Installation" [level=2] [ref=f14e56]
              - generic [ref=f14e57]:
                - code [ref=f14e58]: composer install maidem/pdf-export
                - button "Kopieren" [ref=f14e59] [cursor=pointer]
              - heading "PDF-Warenkorb" [level=2] [ref=f14e60]
              - paragraph [ref=f14e61]: "Besucher können Inhalte seitenübergreifend vormerken, ganz ohne eigene Export-Seite:"
              - list [ref=f14e62]:
                - listitem [ref=f14e63]: Content-Elemente bieten im Backend ein Toggle „PDF-Export Button anzeigen" (data-pdf-section); es gibt auch Gruppen-Buttons, die alle Items eines Bereichs auf einmal hinzufügen (data-pdf-group).
                - listitem [ref=f14e64]: "Ein Klick im Frontend speichert { id, label } im localStorage (Key maidem_pdf_cart)."
                - listitem [ref=f14e65]: Ein schwebender Button unten rechts zeigt einen Badge-Zähler und öffnet bei Klick (bzw. kurz automatisch nach dem Hinzufügen) ein Panel mit allen vorgemerkten Einträgen.
                - listitem [ref=f14e66]: Im Panel lassen sich Einträge per Drag & Drop (Maus und Touch) neu sortieren und einzeln per × entfernen.
                - listitem [ref=f14e67]: „PDF-Dossier herunterladen" postet die gesammelten IDs in genau dieser Reihenfolge als sections[] an ?type=1711, das PDF wird direkt heruntergeladen.
                - listitem [ref=f14e68]: Der Warenkorb ist über localStorage seitenübergreifend und synchronisiert sich per storage-Event live zwischen offenen Tabs.
              - heading "Technische Details" [level=2] [ref=f14e69]
              - list [ref=f14e70]:
                - listitem [ref=f14e71]: PageType 1711 rendert ausschließlich den PDF-Inhalt ohne Seiten-Layout
                - listitem [ref=f14e72]: PdfExportDataProcessor bereitet die Kachel-Auswahl im Frontend vor
                - listitem [ref=f14e73]: "PdfDataService liest Inhalte aus der Datenbank (QueryBuilder, parametrisiert): About, Kontakt, Story, FAQ, Skills sowie News-Datensätze (Projekte/Logbuch)"
                - listitem [ref=f14e74]: PdfExportController baut aus der Auswahl (sections-Parameter) die Blöcke, rendert sie per Fluid-Template und erzeugt das PDF via spatie/browsershot (Chromium) als Download
              - heading "Umgebungsvariablen" [level=2] [ref=f14e75]
              - list [ref=f14e76]:
                - listitem [ref=f14e77]: "PDF_CHROMIUM_PATH Pfad zur Chromium-Binary (Default: `/usr/bin/chromium`)"
                - listitem [ref=f14e78]: "PDF_CHROMIUM_NO_SANDBOX Chromium ohne Sandbox starten, z. B. in Docker-Containern (Default: aus)"
              - generic: 42.53 rem
              - generic: 107.75 rem
