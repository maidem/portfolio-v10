        - heading "My Story" [level=1] [ref=f5e33]
        - paragraph [ref=f5e34]: Im Jahr 2009 übernahm ich mein erstes Projekt für Terre des Hommes bei einer Kampagne gegen Kindersoldaten in Thailand mit TYPO3 4.3. Schon damals trieb mich die Frage um, wie Probleme für alle Stakeholder einfach und intuitiv gelöst werden können.
        - paragraph [ref=f5e35]: Ich probiere ständig Neues aus, baue Prototypen, mache Bedienkonzepte zum Testen kaputt und beobachte Zielgruppen im Back- und Frontend.
        - paragraph [ref=f5e36]: Wenn du jemanden suchst, der digitale Erlebnisse hinterfragt, sie zum Testen auch mal bewusst auf die Probe stellt, auf pixelgenaue Harmonie achtet und dein Team mit frischen Perspektiven bereichern kann, dann lass uns herausfinden, ob wir zusammenpassen.
        - generic: 38.41 rem
        - generic: 24.58 rem
